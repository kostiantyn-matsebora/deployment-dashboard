name: _docs

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  workflow_call:

jobs:
  docs-check:
    name: Docs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check index and registry integrity
        run: python3 scripts/hooks/invoke_docs_keeper_maintenance.py --drift-only
