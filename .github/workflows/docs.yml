name: Docs — Index & Registry Integrity

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  pull_request:
    branches: [main]
    paths: ['**/*.md']

jobs:
  docs-check:
    name: Docs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index and registry integrity
        run: pwsh scripts/hooks/Invoke-PreCommitDocsHook.ps1 -Standalone
