name: frontend

on:
  # Push to main: runs test + Docker publish.
  push:
    branches: [main]
    paths:
      - 'frontend/dashboard/**'
      - '.github/workflows/frontend.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  # workflow_call carries no path filter — the orchestrator's paths-filter decides
  # whether to invoke this workflow. Docker publish is already gated by
  # `github.event_name == 'push'`, so workflow_call never triggers a publish.
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-spa

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build -- --configuration production

  # ── Docker ──────────────────────────────────────────────────────────────────
  # Builds on every run (validates Dockerfile + build context).
  # Scans the local image with Trivy before any push.
  # Pushes the deployment-dashboard-spa image to GHCR only on push to main.
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      - name: Build (local load for scanning)
        uses: docker/build-push-action@v7
        with:
          context: frontend/dashboard
          file: frontend/dashboard/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      - name: Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}:scan
          category: trivy-frontend

      # ── Step 3: Push (main only, cache hit — no rebuild) ──────────────────
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: frontend/dashboard
          file: frontend/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
