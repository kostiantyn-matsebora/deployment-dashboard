name: fetcher

on:
  # Push to main: runs test + Docker publish.
  push:
    branches: [main]
    paths:
      - 'backend/fetcher/**'
      - 'backend/fetcher-github/**'
      - 'backend/fetcher-host/**'
      - 'backend/shared/**'
      - 'backend/tests/Dashboard.Fetcher.Tests/**'
      - '.github/workflows/fetcher.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  # workflow_call carries no path filter — the orchestrator's paths-filter decides
  # whether to invoke this workflow. Docker publish is already gated by
  # `github.event_name == 'push'`, so workflow_call never triggers a publish.
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-fetcher

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tool manifest
        working-directory: backend
        run: dotnet tool restore

      # Formatting only (whitespace + style). Structural analyzers (SonarAnalyzer,
      # Gate B) run in the Build step below — `dotnet format analyzers` would fail
      # verify on warning-level diagnostics that have no code fix.
      - name: Format gate
        working-directory: backend
        run: |
          dotnet format whitespace Dashboard.slnx --verify-no-changes
          dotnet format style Dashboard.slnx --verify-no-changes

      - name: Build
        working-directory: backend
        run: dotnet build Dashboard.slnx -c Release --nologo -p:EnableStructuralAnalyzers=true

      - name: Test
        working-directory: backend
        run: dotnet test tests/Dashboard.Fetcher.Tests/Dashboard.Fetcher.Tests.csproj --settings Dashboard.Fetcher.runsettings --nologo --no-build -c Release

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ── Docker ──────────────────────────────────────────────────────────────────
  # Builds on every run (validates Dockerfile + build context).
  # Scans the local image with Trivy before any push.
  # Pushes to GHCR only on push to main.
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      - name: Build (local load for scanning)
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/fetcher-host/Dashboard.Fetcher.Host/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      - name: Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}:scan
          category: trivy-fetcher

      # ── Step 3: Push (main only, cache hit — no rebuild) ──────────────────
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/fetcher-host/Dashboard.Fetcher.Host/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
