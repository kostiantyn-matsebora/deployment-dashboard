name: extension

on:
  # Push to main: runs test + build (no Docker publish — extension is a zip, not a container).
  push:
    branches: [main]
    paths:
      - 'frontend/extension/**'
      - '.github/workflows/extension.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  # workflow_call carries no path filter — the orchestrator's paths-filter decides
  # whether to invoke this workflow.
  workflow_call:

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/extension

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package extension
        run: python3 ../../scripts/package_extension.py --dist-path dist --output-dir dist-zips

      - name: Upload extension zips
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: frontend/extension/dist-zips/*.zip
          if-no-files-found: error

  # ── Extension E2E ────────────────────────────────────────────────────────────
  e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            testing/e2e/package-lock.json
            frontend/mock/package-lock.json
            frontend/extension/package-lock.json

      - name: Install (e2e)
        run: npm ci
        working-directory: testing/e2e

      - name: Install (mock)
        # --legacy-peer-deps: frontend/mock lockfile has a pre-existing NestJS peer-dep
        # mismatch (@nestjs/common vs @nestjs/core minor version skew) that causes npm ci
        # to abort with ERESOLVE. The flag suppresses the conflict without altering the
        # installed tree; all other Install steps install cleanly without it.
        run: npm ci --legacy-peer-deps
        working-directory: frontend/mock

      - name: Install (extension)
        run: npm ci
        working-directory: frontend/extension

      - name: Install Playwright system deps
        # The E2E fixtures launch the runner's preinstalled Google Chrome
        # (channel: 'chrome'), so no Playwright browser binary download is needed.
        # This installs only the OS shared libraries Playwright needs, via apt
        # (no cdn.playwright.dev fetch — that download stalls in this environment).
        run: npx playwright install-deps chromium
        working-directory: testing/e2e

      - name: Run extension E2E
        env:
          CI: '1'
        run: xvfb-run npm --prefix testing/e2e run test:extension
