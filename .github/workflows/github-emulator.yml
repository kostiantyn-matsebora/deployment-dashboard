name: github-emulator

on:
  push:
    branches: [main]
    paths:
      - 'demo/github-emulator/**'
      - 'demo/data/**'
      - '.github/workflows/github-emulator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'demo/github-emulator/**'
      - 'demo/data/**'
      - '.github/workflows/github-emulator.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-github-emulator

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/github-emulator

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/github-emulator/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript build
        run: npm run build

  # ── Docker ──────────────────────────────────────────────────────────────────
  # Builds on every run (validates Dockerfile + build context).
  # Pushes the github-emulator image to GHCR only on push to main.
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: demo
          file: demo/github-emulator/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
