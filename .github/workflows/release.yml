# Release pipeline -- attach installer assets to a GitHub Release on `v*` tag push.
#
# Owner: devops-engineer.
# Contract: GitHub issue #7 + ADR-0005 + docs/ci-cd-pipelines.md S 10.
#
# Sibling to api.yml / fetcher.yml / frontend.yml / gateway.yml -- on the same tag
# push those four workflows build + push GHCR images; this workflow runs in parallel
# and creates / updates the GitHub Release object, attaching:
#
#   - docker-compose.release.yml   (repo-tracked, ships unmodified)
#   - install.ps1 / install.sh
#   - uninstall.ps1 / uninstall.sh
#
# Compose-file resolution at install time:
#   - docker-compose.release.yml uses `${DASHBOARD_VERSION:-latest}` (resolved by
#     the installer at install-time via `--env-file`).
#   - The compose file ships UNMODIFIED -- no publish-time template render.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create + update release; upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            install/docker-compose.release.yml
            install/install.ps1
            install/install.sh
            install/uninstall.ps1
            install/uninstall.sh
