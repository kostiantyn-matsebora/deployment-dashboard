name: release

# ─────────────────────────────────────────────────────────────────────────────
# Release workflow — fires on an annotated SemVer tag push (e.g. v0.1.0).
#
# A maintainer cuts a release by tagging main manually:
#   git tag -a vX.Y.Z && git push origin vX.Y.Z
# That tag push (and only that) triggers this workflow.
#
# UNIFIED stack version: one tag drives ALL six service images, which share it.
# metadata-action strips the leading `v`, so a tag `vX.Y.Z` publishes images as
# `X.Y.Z`, `X.Y` and `latest`. A pre-release tag (e.g. v0.1.0-rc.1) publishes
# only the full version — never `latest` or the major.minor short tag.
# The release job then assembles release notes + a compose bundle and creates
# the GitHub Release.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['v*.*.*']

jobs:
  # ── Images ────────────────────────────────────────────────────────────────────
  # Build & push all six service images under the shared release tag.
  images:
    name: Image (${{ matrix.key }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: api
            image: deployment-dashboard-api
            context: backend
            dockerfile: backend/api/Dashboard.Api/Dockerfile
          - key: spa
            image: deployment-dashboard-spa
            context: frontend/dashboard
            dockerfile: frontend/dashboard/Dockerfile
          - key: gateway
            image: deployment-dashboard-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - key: fetcher
            image: deployment-dashboard-fetcher
            context: backend
            dockerfile: backend/fetcher-host/Dashboard.Fetcher.Host/Dockerfile
          - key: demo-driver
            image: deployment-dashboard-demo-driver
            context: demo
            dockerfile: demo/driver/Dockerfile
          - key: github-emulator
            image: deployment-dashboard-github-emulator
            context: demo
            dockerfile: demo/github-emulator/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (strip leading v)
        id: ver
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      # Scan before push: the image is loaded but not pushed yet.
      # GHA layer cache is populated here; the push step below is a cache hit.
      # build-args: APP_VERSION is passed only for the api image (bakes the release
      # version with a leading v into the assembly's InformationalVersion, e.g.
      # v0.13.1); other images ignore it.
      - name: Build (local load for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:scan
          build-args: ${{ matrix.key == 'api' && format('APP_VERSION=v{0}', steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      # Each matrix entry gets a unique SARIF category so results from different
      # services do not overwrite each other in the GitHub Security tab.
      - name: Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:scan
          category: trivy-release-${{ matrix.key }}

      # ── Step 3: Push (cache hit — no rebuild, just export + push) ─────────
      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.key == 'api' && format('APP_VERSION=v{0}', steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Demo gateway image ────────────────────────────────────────────────────────
  # Runs after the `images` job so the production gateway image is already pushed
  # to GHCR before this job FROMs it (matrix jobs run in parallel — gateway-demo
  # cannot safely FROM a prod image that may not be pushed yet).
  # PROD_IMAGE is set to the stripped semver so the FROM pulls the exact
  # release version rather than `latest`.
  gateway-demo:
    name: Image (gateway-demo)
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (strip leading v)
        id: ver
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway-demo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      - name: Build (local load for scanning)
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile.demo
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway-demo:scan
          build-args: PROD_IMAGE=ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      - name: Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway-demo:scan
          category: trivy-release-gateway-demo

      # ── Step 3: Push (cache hit — no rebuild, just export + push) ─────────
      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile.demo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROD_IMAGE=ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm chart ─────────────────────────────────────────────────────────────────
  # Packages and publishes the Helm chart as an OCI artifact to GHCR. Runs in
  # parallel with `images` — the chart itself does not embed image digests
  # (values.yaml image.tag defaults to .Chart.AppVersion, resolved at install
  # time), so it has no ordering dependency on the image pushes.
  #
  # Chart version tracks the release SemVer lockstep with the images (Chart.yaml
  # keeps a committed 0.1.0/latest baseline; overridden here at package time —
  # never hand-edited per release). OCI push is fine for pre-release (-rc) tags;
  # unlike the image `latest` tag, OCI charts are always fully versioned, so
  # nothing is skipped for pre-release.
  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR (Helm OCI registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Resolve version (strip leading v)
        id: ver
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package helm/deployment-dashboard \
            --version ${{ steps.ver.outputs.version }} \
            --app-version ${{ steps.ver.outputs.version }} \
            --destination /tmp/helm-package

      - name: Push chart to GHCR
        run: |
          helm push /tmp/helm-package/deployment-dashboard-${{ steps.ver.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  # ── Release ────────────────────────────────────────────────────────────────────
  # Runs once after all images are pushed: extract release notes, bundle the
  # compose stack, and publish the GitHub Release.
  release:
    name: GitHub Release
    needs: [images, gateway-demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        run: |
          python3 - <<'EOF'
          import re, sys, os
          version = os.environ.get('REF_NAME', '').lstrip('v')
          changelog = 'CHANGELOG.md'
          notes = None
          if os.path.exists(changelog):
              lines = open(changelog).readlines()
              start = None
              for i, line in enumerate(lines):
                  if re.match(r'^## \[' + re.escape(version) + r'\]', line):
                      start = i + 1
                      break
              if start is not None:
                  body = []
                  for line in lines[start:]:
                      if re.match(r'^## \[', line):
                          break
                      body.append(line)
                  notes = ''.join(body).strip()
          if not notes:
              notes = f"Release ${{ github.ref_name }}"
          open('release-notes.md', 'w').write(notes + '\n')
          print(f"Release notes for {version}:")
          print(notes)
          EOF
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Assemble compose bundle
        # Plain `zip` (bash) — no PowerShell dot-file/hidden-item semantics, so the
        # .env.example dot-file is included reliably. -j flattens paths (files at the
        # zip root), matching the curl-into-cwd deploy flow in the docs.
        run: |
          zip -j "deployment-dashboard-compose-${{ github.ref_name }}.zip" compose/*.yaml compose/.env.example
          unzip -l "deployment-dashboard-compose-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: deployment-dashboard-compose-${{ github.ref_name }}.zip

  # ── Compose OCI artifacts ─────────────────────────────────────────────────────
  # Publishes TWO Compose projects as OCI artifacts to GHCR so adopters can run
  # the stack with a single `docker compose -f oci://… up` — no clone, no curl.
  #
  # Artifacts:
  #   deployment-dashboard-compose       — base file only (production profiles)
  #   deployment-dashboard-compose-demo  — base + demo overlay (demo profile)
  #
  # Variable interpolation is CLIENT-SIDE: `publish` ships the templated YAML
  # source with ${VAR} placeholders intact; resolution happens at `up` time on
  # the adopter's machine from their CWD .env / host env / --env-file.  The
  # --with-env flag (intentionally NOT used here) is the opt-in that would bake
  # values at publish time.  The demo overlay hardcodes insecure defaults for
  # zero-config evaluation; the production artifact ships raw placeholders that
  # the adopter fills via a local .env — both are safe to publish.
  #
  # Image pinning: DASHBOARD_VERSION is set to the release version (no leading v)
  # before publish so ${DASHBOARD_VERSION:-latest} resolves to the release images.
  # --resolve-image-digests pins those image tags to their exact SHA256 digest,
  # producing a fully reproducible artifact.  (This is the one value that IS
  # resolved at publish time — image refs only, not env vars.)
  #
  # Tagging: each artifact is tagged with both the version string and `latest`.
  # `latest` is skipped for pre-release tags (those containing `-`), consistent
  # with the image job above.
  compose-artifacts:
    name: Compose OCI artifacts
    needs: [images, gateway-demo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (strip leading v)
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Publish production Compose artifact (versioned tag)
        # Base file only — production profiles (standalone / full and their -pull
        # variants). Ships templated YAML; adopter supplies secrets via .env at
        # up time. --resolve-image-digests pins image refs to digests; env var
        # placeholders are preserved for client-side resolution.
        env:
          DASHBOARD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose -f compose/docker-compose.yaml publish \
            --yes \
            --resolve-image-digests \
            ghcr.io/${{ github.repository_owner }}/deployment-dashboard-compose:${{ steps.version.outputs.version }}

      - name: Publish production Compose artifact (latest tag)
        # Skipped for pre-release tags (any tag containing '-').
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DASHBOARD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose -f compose/docker-compose.yaml publish \
            --yes \
            --resolve-image-digests \
            ghcr.io/${{ github.repository_owner }}/deployment-dashboard-compose:latest

      - name: Publish demo Compose artifact (versioned tag)
        # Base + demo overlay merged — includes Demo Driver, GitHub Emulator, and
        # demo-specific gateway routing. The overlay hardcodes insecure defaults
        # so the demo profile needs no .env at up time (zero-config evaluation).
        env:
          DASHBOARD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose \
            -f compose/docker-compose.yaml \
            -f compose/docker-compose.demo.yaml \
            publish \
            --yes \
            --resolve-image-digests \
            ghcr.io/${{ github.repository_owner }}/deployment-dashboard-compose-demo:${{ steps.version.outputs.version }}

      - name: Publish demo Compose artifact (latest tag)
        # Skipped for pre-release tags (any tag containing '-').
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DASHBOARD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose \
            -f compose/docker-compose.yaml \
            -f compose/docker-compose.demo.yaml \
            publish \
            --yes \
            --resolve-image-digests \
            ghcr.io/${{ github.repository_owner }}/deployment-dashboard-compose-demo:latest
