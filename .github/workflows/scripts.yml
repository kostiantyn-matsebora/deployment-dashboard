# User-facing scripts CI — runs the Pester (PowerShell) + bats (bash) test
# suites that exercise install.ps1 / install.sh / uninstall.ps1 / uninstall.sh
# and dev_env/start.ps1 / dev_env/stop.ps1.
#
# Owner: devops-engineer.
# Contract: user-facing follow-up to GitHub issue #7 — closes the script-test
#           gap noted in qa-engineer's Phase 5 report. Tests live under
#           testing/scripts/ (Pester *.Tests.ps1 + bats *.bats); this workflow
#           gates them on every PR + main / tag push.
#
# Sibling shape to api.yml / fetcher.yml / frontend.yml / gateway.yml — same
# trigger filter + concurrency pattern. Differs in that no container image is
# built and no GHCR push occurs: this is a pure verification gate.
#
# Why ubuntu-latest for both jobs:
#   - PowerShell 7 (pwsh) is pre-installed on GHA ubuntu-latest runners; the
#     PS1 scripts under test are PS 7-cross-platform and run identically on
#     Linux under pwsh.
#   - bash is native; bats runs without any OS-specific setup.
#   - Cross-OS verification (Windows, macOS) is a Phase 5 manual concern, not
#     a per-PR gate — keeping the matrix at one dimension keeps PR feedback
#     under a minute.
#
# QA contract surface (testing/scripts/, owned by qa-engineer):
#   install.Tests.ps1     -> install.ps1
#   uninstall.Tests.ps1   -> uninstall.ps1
#   start.Tests.ps1       -> dev_env/start.ps1
#   stop.Tests.ps1        -> dev_env/stop.ps1
#   install.bats          -> install.sh
#   uninstall.bats        -> uninstall.sh
# Tests use subprocess invocation + PATH shadowing for stubs; they do NOT
# require Docker on the runner — they assert on script exit codes + stdout /
# stderr + filesystem side-effects.
#
# Decision locks for this file:
#   D1  Blocking gate — both jobs must pass for merge eligibility. No
#       continue-on-error anywhere.
#   D2  Single ubuntu-latest runner per job — no matrix. Cross-OS coverage
#       moved up to Phase 5 manual smoke.
#   D3  tags ['v*'] trigger retained — script content rarely changes on tag,
#       but running the gate on the tag push catches "did release.yml's
#       installer-asset assumptions break?" cheaply.
#   D4  permissions = contents: read only — no GHCR push, no release-asset
#       upload, no notifications.
name: scripts

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'uninstall.ps1'
      - 'uninstall.sh'
      - 'dev_env/start.ps1'
      - 'dev_env/stop.ps1'
      - 'testing/scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'uninstall.ps1'
      - 'uninstall.sh'
      - 'dev_env/start.ps1'
      - 'dev_env/stop.ps1'
      - 'testing/scripts/**'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pester job — exercises the four PS1 scripts via Invoke-Pester. Tests use
  # subprocess invocation (Start-Process pwsh) and PATH shadowing so docker /
  # docker-compose can be stubbed in-test without requiring a real container
  # runtime on the runner.
  pester:
    name: pester
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PowerShell 7 is pre-installed on GHA ubuntu-latest. We pin Pester 5+
      # because the test config block in step 3 uses the v5 fluent API
      # (New-PesterConfiguration); v4 ignores it silently and reports zero
      # tests, which would be a false green.
      - name: Install Pester 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester `
            -MinimumVersion 5.0 `
            -Force `
            -SkipPublisherCheck `
            -Scope CurrentUser
          Get-Module -ListAvailable Pester | Select-Object Name, Version | Format-Table

      # Run Pester with NUnit XML output for downstream consumption (artefact
      # upload below; future hookup to test-reporter actions if we add one).
      # Run.Exit = $true so a non-zero failure count fails the job — without
      # it Invoke-Pester returns the failure count as data, not as an exit
      # code, and the step would always be green.
      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = New-PesterConfiguration
          $config.Run.Path = 'testing/scripts'
          $config.Run.Exit = $true
          $config.Filter.Tag = @()
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testing/scripts/pester-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      # if: always() so the artefact uploads even when the test run fails —
      # the failure case is when the report matters most.
      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/scripts/pester-results.xml
          if-no-files-found: warn
          retention-days: 14

  # bats job — exercises install.sh + uninstall.sh. Same stubbing pattern as
  # Pester: PATH shadowing for docker / curl / etc.
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bats-core's official setup action — installs bats-core + the
      # commonly-paired bats-assert / bats-support / bats-file libraries. The
      # action handles symlinking into /usr/local/bin so `bats` is on PATH.
      - name: Install bats-core
        uses: bats-core/bats-action@3.0.0
        with:
          support-install: true
          assert-install: true
          file-install: true

      # tee so the TAP stream lands in the runner log AND is captured for the
      # artefact upload. set -o pipefail so a non-zero bats exit propagates
      # through the pipe — without it the tee-side success would mask the
      # bats-side failure and the job would be green on a red suite.
      - name: Run bats tests
        run: |
          set -o pipefail
          bats --tap testing/scripts/*.bats | tee testing/scripts/bats-results.tap

      - name: Upload bats results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: testing/scripts/bats-results.tap
          if-no-files-found: warn
          retention-days: 14
