name: _scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/**/pyproject.toml'
      - 'scripts/**/*.sh'
      - 'scripts/**/*.bats'
      - '.github/workflows/scripts.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  workflow_call:

jobs:
  scripts-check:
    name: Lint and test scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        # ubuntu-latest ships bats 1.x from apt; pinning via apt keeps the step
        # hermetic without requiring npm/git clone.  Bump the package version if
        # a specific Bats-core release is ever needed.
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y bats

      - name: Assert every .sh has a sibling .bats
        shell: bash
        run: |
          missing=()
          while IFS= read -r -d '' sh; do
            bats="${sh%.sh}.bats"
            [[ -f "$bats" ]] || missing+=("$sh")
          done < <(find scripts -name '*.sh' -print0)
          if (( ${#missing[@]} > 0 )); then
            printf 'ERROR: missing .bats suite for:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Sibling-existence gate passed (${#missing[@]} missing)"

      - name: Test bash scripts (bats)
        shell: bash
        run: |
          mapfile -d '' suites < <(find scripts -name '*.bats' -print0)
          if (( ${#suites[@]} == 0 )); then
            echo "No .bats suites found — skipping"
            exit 0
          fi
          bats --tap "${suites[@]}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest ruff jsonschema

      - name: Lint (ruff)
        run: ruff check scripts/

      - name: Test (pytest)
        run: python -m pytest scripts/ -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-results.xml
