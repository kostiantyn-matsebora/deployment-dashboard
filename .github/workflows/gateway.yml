name: gateway

on:
  # Push to main: Docker publish.
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  # workflow_call carries no path filter — the orchestrator's paths-filter decides
  # whether to invoke this workflow. Docker publish is already gated by
  # `github.event_name == 'push'`, so workflow_call never triggers a publish.
  workflow_call:

env:
  IMAGE:      ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway
  IMAGE_DEMO: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway-demo

jobs:
  # Config-only image — no unit tests (GW2).
  # Behaviour is verified by the cross-stack integration suite.
  # The Docker build on every run validates that the Dockerfile and template
  # are syntactically well-formed.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Production gateway ─────────────────────────────────────────────────

      - name: Docker metadata (prod)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      - name: Build prod (local load for scanning)
        id: build-prod
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      - name: Trivy scan (prod)
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}:scan
          category: trivy-gateway

      # ── Step 3: Push (main only, cache hit — no rebuild) ──────────────────
      - name: Push prod to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Demo gateway (layers on the prod image) ────────────────────────────
      # The demo image FROMs the prod image; build the prod image first so the
      # demo build can reference it locally (load: true above populates the daemon).
      # PROD_IMAGE resolves the FROM ARG in Dockerfile.demo to the scan tag
      # built above so the demo build is entirely local (no pull from GHCR needed).

      - name: Docker metadata (demo)
        id: meta-demo
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_DEMO }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build demo (local load for scanning)
        run: |
          docker build \
            --build-arg PROD_IMAGE=${{ env.IMAGE }}:scan \
            -f gateway/Dockerfile.demo \
            -t ${{ env.IMAGE_DEMO }}:scan \
            gateway

      - name: Trivy scan (demo)
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE_DEMO }}:scan
          category: trivy-gateway-demo

      - name: Push demo to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile.demo
          push: true
          tags: ${{ steps.meta-demo.outputs.tags }}
          labels: ${{ steps.meta-demo.outputs.labels }}
          # Use the GHCR `latest` tag for the prod base: the prod push step (run
          # just above on the same main push) has already pushed
          # ghcr.io/.../gateway:latest to GHCR, making it pullable by BuildKit in
          # container mode. The scan tag is local-daemon-only and not available to
          # the BuildKit builder for push.
          build-args: |
            PROD_IMAGE=${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
