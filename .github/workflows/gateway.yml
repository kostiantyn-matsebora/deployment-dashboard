name: gateway

on:
  # Push to main: Docker publish.
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  # Called by ci.yml (the _ci-green orchestrator) for PR checks.
  # workflow_call carries no path filter — the orchestrator's paths-filter decides
  # whether to invoke this workflow. Docker publish is already gated by
  # `github.event_name == 'push'`, so workflow_call never triggers a publish.
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deployment-dashboard-gateway

jobs:
  # Config-only image — no unit tests (GW2).
  # Behaviour is verified by the cross-stack integration suite.
  # The Docker build on every run validates that the Dockerfile and template
  # are syntactically well-formed.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # required for SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Step 1: Build locally (load into Docker daemon for scanning) ───────
      - name: Build (local load for scanning)
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 2: Trivy vulnerability scan ──────────────────────────────────
      - name: Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}:scan
          category: trivy-gateway

      # ── Step 3: Push (main only, cache hit — no rebuild) ──────────────────
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
