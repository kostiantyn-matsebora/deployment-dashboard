# Demo-gha component CI — builds the content-only JVM WireMock image that
# bakes the qa-owned demo bundle (testing/fixtures/gha/demo/) for the
# release-install demo profile.
#
# Owner: devops-engineer.
# Contract: docs/cr/CR-0013-demo-mode-default-installer.md (S 3c — Baked
#           demo-gha Docker image). 5th component image alongside api /
#           fetcher / frontend / gateway. Tag scheme + reusable-workflow
#           shape inherited from CR-0010.
#
# Why no tests / no format gate:
#   - Image content is one `COPY testing/fixtures/gha/demo/` over a
#     WireMock.Net 2.4.0 base layer. No .NET source, no Angular source,
#     no shell logic. Format gate + unit tests have nothing to gate.
#   - Bundle content correctness is verified at runtime by the qa-owned
#     scenarios (CR-0013 S 3e dynamic-mock scenario walk) and by Phase 5
#     acceptance checks against the dashboard (>= 20 populated slots
#     within 60s; >= 3 events/min over first 5 min).
#
# Path filters cover:
#   - gateway/demo-gha/**          — the Dockerfile + README owned by devops.
#   - testing/fixtures/gha/demo/** — the bundle content baked into the image
#                                    (qa-owned). A bundle change must
#                                    rebuild the image to track CR-0013's
#                                    "bundle versioning tracks image tag"
#                                    invariant.
#   - .github/workflows/demo-gha.yml             — self-reference.
#   - .github/workflows/_build-and-push-image.yml — reusable workflow
#                                                   (added so a change to
#                                                   the shared shape
#                                                   triggers a rebuild).
name: demo-gha

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'gateway/demo-gha/**'
      - 'testing/fixtures/gha/demo/**'
      - '.github/workflows/demo-gha.yml'
      - '.github/workflows/_build-and-push-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/demo-gha/**'
      - 'testing/fixtures/gha/demo/**'
      - '.github/workflows/demo-gha.yml'
      - '.github/workflows/_build-and-push-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/_build-and-push-image.yml
    with:
      image-name: deployment-dashboard-demo-gha
      # Content-only image -- no .NET, no Node, no tests. The reusable
      # workflow's language-setup / test / format-gate steps are if-gated
      # to dotnet|static and naturally skip for `copy`, leaving only:
      # checkout -> buildx -> (conditional) registry login -> metadata ->
      # build + push.
      build-kind: copy
      dockerfile-path: gateway/demo-gha/Dockerfile
      # Build context MUST be the repo root: the Dockerfile's only COPY
      # reaches into testing/fixtures/gha/demo/, which lives outside
      # gateway/. CR-0013 S 3c locks this decision.
      context-path: .
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
