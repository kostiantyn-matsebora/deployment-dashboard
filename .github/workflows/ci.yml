name: _ci-green

# Always-present PR gate for branch protection.
#
# Every PR to main produces exactly one required status check named `_ci-green`.
# It passes when all relevant area checks pass (or were skipped because their
# paths were untouched). It fails when any relevant check failed or was cancelled.
#
# Design: reusable workflows (Option A)
#   - Per-service workflows expose `workflow_call` (no path filter on that trigger).
#   - This orchestrator owns ALL PR-time path filtering via dorny/paths-filter.
#   - Per-service `push: [main]` triggers (with path filters) remain untouched,
#     so Docker publish on merge to main continues to work independently.
#   - The `pull_request:` triggers were removed from the per-service workflows to
#     prevent double-runs: the orchestrator is the sole PR entry point.
#   - `github.event_name` is `workflow_call` when called from here, which is
#     never `== 'push'`, so Docker push steps in callee workflows never fire on PRs.
#
# Excluded from this gate (not PR quality signals):
#   - pages.yml  — GitHub Pages deploy, not a correctness check
#   - release.yml — tag-only workflow, never runs on PRs

on:
  pull_request:
    branches: [main]
    # NO path filter here — this workflow must run on every PR to main,
    # regardless of which files were changed.

# Least-privilege default for the gate jobs:
#   - contents: read       — checkout
#   - pull-requests: read  — dorny/paths-filter calls the PR listFiles API
# A called reusable workflow's GITHUB_TOKEN is capped by the CALLER's
# permissions, so the six service caller jobs (whose workflows include a Docker
# job declaring packages: write) widen to packages: write below. Docker push
# itself stays gated by event_name == 'push', so nothing is published on PRs
# regardless of the granted scope.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Path detection ───────────────────────────────────────────────────────────
  # Detect which areas changed. Each output is 'true' or 'false'.
  # Path globs mirror the per-service workflow path filters exactly.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api:             ${{ steps.filter.outputs.api }}
      frontend:        ${{ steps.filter.outputs.frontend }}
      gateway:         ${{ steps.filter.outputs.gateway }}
      fetcher:         ${{ steps.filter.outputs.fetcher }}
      demo-driver:     ${{ steps.filter.outputs['demo-driver'] }}
      github-emulator: ${{ steps.filter.outputs['github-emulator'] }}
      api-tests:       ${{ steps.filter.outputs['api-tests'] }}
      docs:            ${{ steps.filter.outputs.docs }}
      scripts:         ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'backend/**'
              - '.github/workflows/api.yml'
            frontend:
              - 'frontend/dashboard/**'
              - '.github/workflows/frontend.yml'
            gateway:
              - 'gateway/**'
              - '.github/workflows/gateway.yml'
            fetcher:
              - 'backend/fetcher/**'
              - 'backend/fetcher-github/**'
              - 'backend/fetcher-host/**'
              - 'backend/shared/**'
              - 'backend/tests/Dashboard.Fetcher.Tests/**'
              - '.github/workflows/fetcher.yml'
            demo-driver:
              - 'demo/driver/**'
              - 'demo/data/**'
              - '.github/workflows/demo-driver.yml'
            github-emulator:
              - 'demo/github-emulator/**'
              - 'demo/data/**'
              - '.github/workflows/github-emulator.yml'
            api-tests:
              - 'backend/**'
              - 'demo/**'
              - 'compose/**'
              - 'testing/api/**'
              - '.github/workflows/api-tests.yml'
            docs:
              - '**/*.md'
            scripts:
              - 'scripts/**/*.ps1'
              - '.github/workflows/scripts.yml'

  # ── Area callers ─────────────────────────────────────────────────────────────
  # Each job calls the corresponding reusable workflow only when its area changed.
  # When skipped (if condition false), GitHub marks the job as skipped — which
  # alls-green treats as success by default.

  ci-api:
    name: CI / api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/api.yml

  ci-frontend:
    name: CI / frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/frontend.yml

  ci-gateway:
    name: CI / gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gateway.yml

  ci-fetcher:
    name: CI / fetcher
    needs: changes
    if: needs.changes.outputs.fetcher == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fetcher.yml

  ci-demo-driver:
    name: CI / demo-driver
    needs: changes
    if: needs.changes.outputs['demo-driver'] == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/demo-driver.yml

  ci-github-emulator:
    name: CI / github-emulator
    needs: changes
    if: needs.changes.outputs['github-emulator'] == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/github-emulator.yml

  ci-api-tests:
    name: CI / api-tests
    needs: changes
    if: needs.changes.outputs['api-tests'] == 'true'
    uses: ./.github/workflows/api-tests.yml

  ci-docs:
    name: CI / docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml

  ci-scripts:
    name: CI / scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    uses: ./.github/workflows/scripts.yml

  # ── Required gate ────────────────────────────────────────────────────────────
  # THIS job's name is the required status-check context registered in branch protection.
  # `if: always()` ensures it runs even when callers are skipped or failed.
  # alls-green treats SKIPPED as a failure unless the job is in `allowed-skips`.
  # The area jobs skip whenever their paths are untouched, so all nine are listed
  # as allowed-skips; `changes` is not (it must always run and succeed). A real
  # FAILURE in any area still fails the gate — allowed-skips only tolerates skips.
  _ci-green:
    name: _ci-green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - ci-api
      - ci-frontend
      - ci-gateway
      - ci-fetcher
      - ci-demo-driver
      - ci-github-emulator
      - ci-api-tests
      - ci-docs
      - ci-scripts
    steps:
      - name: All checks passed or skipped
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: |
            ci-api
            ci-frontend
            ci-gateway
            ci-fetcher
            ci-demo-driver
            ci-github-emulator
            ci-api-tests
            ci-docs
            ci-scripts
