# ─────────────────────────────────────────────────────────────────────────────
# Demo overrides — hardcoded insecure defaults for local evaluation only.
# NOT suitable for production or any internet-exposed environment.
#
# This overlay also DEFINES the demo-only simulators (demo-driver, github-emulator)
# and the gateway's /demo/* routing — they are intentionally absent from the base
# docker-compose.yaml so the base stays production-only. Hence this file is
# required for the `demo` profile, not merely an override.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.demo.yaml --profile demo up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Demo-only: swap the production gateway image for the demo-gateway image.
  # The demo-gateway image (Dockerfile.demo) layers on top of the production image
  # and adds demo.snippet.template, which activates /demo/* routing at runtime.
  # DNS_RESOLVER and DEMO_DRIVER_UPSTREAM are required by the snippet's resolver
  # directive and variable-based proxy_pass; they are absent from the prod image.
  gateway:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-gateway-demo:${DASHBOARD_VERSION:-latest}
    environment:
      DEMO_DRIVER_UPSTREAM: "demo-driver:3001"
      # 127.0.0.11 is the Docker embedded DNS — correct default for Compose.
      # Override with 168.63.129.16 for Azure Container Apps if running demo there.
      DNS_RESOLVER: "${DNS_RESOLVER:-127.0.0.11}"
    depends_on:
      demo-driver:
        condition: service_healthy
        required: false

  api:
    environment:
      API_KEY: demo-api-key
      # Insecure demo default — enables POST /api/control/reset for local evaluation.
      CONTROL_API_KEY: demo-control-key
      POSTGRES_HOST:     "postgres"
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       "deployment_dashboard"
      POSTGRES_USER:     "dashboard"
      POSTGRES_PASSWORD: "changeme"

  # ── Demo Driver (demo-only simulator — defined here, not in the base) ────────
  demo-driver:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-demo-driver:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [demo-driver, demo]
    environment:
      # Target Write API — must match the api service name in this network.
      WRITE_API_URL: "http://api:8080"
      # Demo secrets — must match the api service above.
      API_KEY: demo-api-key
      CONTROL_API_KEY: demo-control-key
      # Scenario JSON files are baked into the image at /app/data (Dockerfile).
      SCENARIOS_DIR: /app/data
      EMIT_DELAY_MS: "${EMIT_DELAY_MS:-0}"
      EMIT_INTERVAL_MS: "${EMIT_INTERVAL_MS:-8000}"
      PORT: "3001"
      # Health-aggregator probe targets (DEMO_DRIVER_SPEC §9).
      GITHUB_EMULATOR_URL: "http://github-emulator:3100"
      FETCHER_URL: "http://fetcher-host:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/demo/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── GitHub Emulator (demo-only simulator — defined here, not in the base) ────
  # Internal-only — no gateway route; the fetcher reaches it directly.
  github-emulator:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-github-emulator:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [github-emulator, demo]
    environment:
      PORT: "3100"
      GITHUB_SIM_RATE_LIMIT: "${GITHUB_SIM_RATE_LIMIT:-5000}"
      SEED_ON_STARTUP: "true"
      SCENARIOS_DIR: /app/data
      EMIT_INTERVAL_MS: "${EMIT_INTERVAL_MS:-8000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/_github/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  fetcher-host:
    environment:
      # Must match the demo api key above.
      API_KEY: demo-api-key
      # Must match the demo control key — fetcher participates in reset choreography.
      CONTROL_API_KEY: demo-control-key
      # Short poll interval for demo responsiveness.
      POLL_INTERVAL_SECONDS: "10"
      # Repoint the fetcher at the in-stack github-emulator instead of api.github.com.
      GITHUB_BASE_URL: "http://github-emulator:3100"
      GITHUB_TOKEN: "demo-token"
      GITHUB_REPOS: "demo-org/storefront,demo-org/platform,demo-org/operations,demo-org/data-pipeline"
      GITHUB_VERSION_SOURCE: "artifact:version.txt"
      GITHUB_RATE_LIMIT: "${GITHUB_SIM_RATE_LIMIT:-5000}"
      GITHUB_RATE_LIMIT_BUDGET_PCT: "80"
    # Demo-only dependency — the emulator does not exist in production.
    depends_on:
      github-emulator:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_USER:     dashboard
      POSTGRES_PASSWORD: changeme
