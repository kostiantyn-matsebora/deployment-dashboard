name: deployment-dashboard

# ─────────────────────────────────────────────────────────────────────────────
# Profiles
#
# Ingestion is push-first: CI/CD posts events to POST /api/deployments. The
# Fetcher is an optional pull-mode adapter (polls a source, posts via the same
# endpoint) — so the base profiles are push-only and the `-pull` variants add it.
#
#   standalone       — Cloud / distributed setup: PostgreSQL is a managed/external
#                      service, the app tier scales horizontally behind the gateway.
#                      Push-only ingestion (default — no Fetcher).
#                      Services: Gateway + Frontend + API (external PG).
#                      Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST
#
#   standalone-pull  — Like standalone (cloud / external DB), plus the Fetcher for
#                      pull-mode ingestion alongside push.
#                      Services: Gateway + Frontend + API + Fetcher (external PG).
#                      Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST
#                      (+ GITHUB_REPOS / GITHUB_TOKEN for the Fetcher pull source).
#
#   full             — Single-VM / all-in-one setup: the stack owns its PostgreSQL
#                      (Docker volume) on the same host.
#                      Push-only ingestion (default — no Fetcher).
#                      Services: Gateway + Frontend + API + PostgreSQL.
#                      Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD
#
#   full-pull        — Like full (single-VM, self-contained DB), plus the Fetcher
#                      for pull-mode ingestion alongside push.
#                      Services: Gateway + Frontend + API + Fetcher + PostgreSQL.
#                      Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD
#                      (+ GITHUB_REPOS / GITHUB_TOKEN for the Fetcher pull source).
#
#   demo             — Zero-config local evaluation. The Demo Driver + GitHub
#                      Emulator simulate deployments and a GitHub pull source, so
#                      the stack runs with no external dependencies. Both simulators
#                      are defined in docker-compose.demo.yaml (not here) — that
#                      overlay is REQUIRED for this profile; no vars to set.
#                      Services: Gateway + Frontend + API + Fetcher + PostgreSQL
#                      (this file) + Demo Driver + GitHub Emulator (demo overlay).
#                      CORS: off (gateway mode)  |  Retention: 30 days
#
# Per-service profiles (gateway / frontend / api / db / fetcher-host) allow a
# single service to be targeted in isolation, e.g. `--profile fetcher-host`.
# (demo-driver / github-emulator are defined in docker-compose.demo.yaml.)
#
# The gateway is the single public surface (SAD §7, GW1).
# The frontend, API and PostgreSQL are internal-only; only the gateway exposes a port.
#
# Usage:
#   docker compose --profile standalone       up
#   docker compose --profile standalone-pull  up
#   docker compose --profile full             up
#   docker compose --profile full-pull        up
#   docker compose -f docker-compose.yaml -f docker-compose.demo.yaml --profile demo up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Gateway (single public surface) ─────────────────────────────────────────
  gateway:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-gateway:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [gateway, standalone, standalone-pull, full, full-pull, demo]
    ports:
      - target: 8080
        published: "${GATEWAY_PORT:-8080}"
        protocol: tcp
    environment:
      # Internal API upstream — fixed to the api service name in this network.
      API_UPSTREAM: "api:8080"
      # Internal frontend upstream.  The frontend image (nginx:alpine) listens
      # on :80.  Requests to / return 502 until the frontend container is
      # running; all /api/* and probe routes work without it.
      FRONTEND_UPSTREAM: "${FRONTEND_UPSTREAM:-frontend:80}"
      # The gateway template references ${DEMO_DRIVER_UPSTREAM} for the /demo/*
      # locations. A default is supplied here so envsubst always produces a
      # syntactically valid nginx config (no unsubstituted ${...} literal).
      # In non-demo profiles demo-driver does not exist, so the resolver cannot
      # resolve the name at request time and /demo/* returns 502 — the intended
      # production behavior. Startup is unaffected.
      # docker-compose.demo.yaml overrides this to the same value; that override
      # is harmless but redundant after this default.
      DEMO_DRIVER_UPSTREAM: "${DEMO_DRIVER_UPSTREAM:-demo-driver:3001}"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
        required: false   # frontend may be omitted (gateway serves /api/* alone)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend (Angular SPA, nginx-served) ─────────────────────────────────────
  frontend:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-spa:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [frontend, standalone, standalone-pull, full, full-pull, demo]
    # Internal-only — the gateway proxies / to this service; no published port.
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships busybox wget (no curl); 200 on / means the SPA serves.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-api:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [api, standalone, standalone-pull, full, full-pull, demo]
    environment:
      # Connection string assembled from individual parts so each can be
      # overridden independently.  Override POSTGRES_HOST for standalone.
      ConnectionStrings__Postgres: >-
        Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-deployment_dashboard};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Write-endpoint shared secret.  Required — validated on app startup.
      API_KEY: "${API_KEY}"
      # Control-surface shared secret (API_SPECIFICATION.md D8).
      # Optional — absent (empty) hides POST /api/control/reset entirely (returns 404).
      # Set to enable the reset surface; keep distinct from API_KEY (least-privilege).
      CONTROL_API_KEY: "${CONTROL_API_KEY:-}"
      # CSV of allowed CORS origins.  Empty disables CORS (gateway / same-origin).
      # Default is empty — gateway mode is the standard deployment (GW6).
      # Set only when running the API without the gateway (split-domain mode,
      # API_SPECIFICATION.md D6); the two modes are mutually exclusive.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # Minimum 90, default 365.  The demo profile overrides this to a shorter window.
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-365}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # postgres is not started in the standalone / standalone-pull profiles (external DB)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Fetcher Host (pull-mode adapter — standalone-pull / full-pull / demo) ─────
  fetcher-host:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-fetcher:${DASHBOARD_VERSION:-latest}
    pull_policy: always
    profiles: [fetcher-host, standalone-pull, full-pull, demo]
    # Internal-only — no published port, no gateway route (FETCHER_SPECIFICATION §3, §6).
    environment:
      DASHBOARD_API_BASE_URL: "http://api:8080"
      API_KEY: "${API_KEY}"
      CONTROL_API_KEY: "${CONTROL_API_KEY:-}"
      COMPONENT_ID: "dashboard-fetcher"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-30}"
      # GitHub source — points at REAL GitHub by default. The demo override
      # (docker-compose.demo.yaml) repoints this at the in-stack github-emulator.
      # Key after __ must match the C# property name (PascalCase); .NET config
      # maps __ to a section separator and binds by property name, not SCREAMING_SNAKE.
      GITHUB__BaseUrl: "${GITHUB_BASE_URL:-https://api.github.com}"
      GITHUB__Token: "${GITHUB_TOKEN:-}"
      GITHUB__Repos: "${GITHUB_REPOS:-}"
      GITHUB__VersionSource: "${GITHUB_VERSION_SOURCE:-attribute:sha}"
      # Unset GITHUB__RateLimit → discovered from GitHub /rate_limit on startup (F16).
      GITHUB__RateLimitBudgetPct: "${GITHUB_RATE_LIMIT_BUDGET_PCT:-30}"
      BACKFILL: "${BACKFILL:-false}"
      BACKFILL_MAX_AGE: "${BACKFILL_MAX_AGE:-}"
      BACKFILL_DEPTH: "${BACKFILL_DEPTH:-2}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    profiles: [db, full, full-pull, demo]
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-deployment_dashboard}"
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
