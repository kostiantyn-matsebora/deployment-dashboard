# ─────────────────────────────────────────────────────────────────────────────
# Test overrides — deterministic, isolated environment for the API integration
# test suite (testing/api/tests/integration/).
#
# Appended last in COMPOSE_FILE so these values win over demo defaults.
#
# ── Reset choreography isolation ─────────────────────────────────────────────
#   AckTimeoutSeconds = 3   Short window so timeout-backstop tests finish fast.
#   ExpectedComponents = [api-test-reset]
#                           A single synthetic component id the test suite
#                           controls via POST /api/control/events.  The real
#                           demo-driver and fetcher-host stay in the stack but
#                           are NOT in ExpectedComponents, so their acks are
#                           ignored by the reset gate (they still react to
#                           reset-initiated — that is fine; the test drives
#                           completion independently via api-test-reset).
#
#   IMPORTANT — .NET array binding does NOT replace the whole array. Config
#   children are bound by INDEX over the keys present across providers (env wins
#   over appsettings at a shared index), and the result is APPENDED onto the
#   ResetOptions.ExpectedComponents property default. That default is therefore
#   kept EMPTY ([]) in code so this override fully defines the set; were it the
#   old ["dashboard-fetcher","demo-driver"] initializer, those two would survive
#   here as phantom expected components the gate would wait on forever.
#   appsettings.json seeds ["dashboard-fetcher","demo-driver"] at indices 0,1, so
#   we pin BOTH __0 and __1 to "api-test-reset" (env wins at both) → the bound
#   array is ["api-test-reset","api-test-reset"], which dedups to {api-test-reset}.
#   GateMaxTtlSeconds = 15  Enough headroom for the longest test scenario
#                           (timeout backstop at ~3 s + overhead) without
#                           wedging ingest during teardown.
#
# ── GitHub emulator isolation ─────────────────────────────────────────────────
#   SEED_ON_STARTUP = false  The emulator starts EMPTY. The fetcher therefore
#                           backfills nothing by default, keeping demo-driver
#                           and reset-choreography tests unaffected by phantom
#                           fetcher data. The github-fetcher.spec.ts test
#                           explicitly seeds the emulator via
#                           POST /demo/github/seed {dataset:"demo"} and cleans
#                           up with POST /demo/github/clear + resetAll() in
#                           afterAll, so subsequent specs see a clean slate.
#
# ── Fetcher-host timing ───────────────────────────────────────────────────────
#   POLL_INTERVAL_SECONDS = 2   Fast poll so the github scenario doesn't wait
#                           long for backfill to appear.  The reset gate still
#                           ignores fetcher acks (ExpectedComponents above), so
#                           reset-choreography tests are unaffected by the
#                           fetcher's presence.
#   GITHUB__RateLimitBudgetPct = 100   Use the full simulated budget for speed.
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    environment:
      Reset__AckTimeoutSeconds: "3"
      Reset__ExpectedComponents__0: "api-test-reset"
      Reset__ExpectedComponents__1: "api-test-reset"
      Reset__GateMaxTtlSeconds: "15"

  github-emulator:
    environment:
      SEED_ON_STARTUP: "false"

  fetcher-host:
    environment:
      POLL_INTERVAL_SECONDS: "2"
      GITHUB__RateLimitBudgetPct: "100"
