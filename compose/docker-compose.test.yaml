# ─────────────────────────────────────────────────────────────────────────────
# Test overrides — deterministic, isolated environment for the API integration
# test suite (testing/api/tests/integration/).
#
# Appended last in COMPOSE_FILE so these values win over demo defaults.
#
# ── Reset choreography isolation ─────────────────────────────────────────────
#   RESET_ACK_TIMEOUT_SECONDS = 3   Short window so timeout-backstop tests finish fast.
#   RESET_EXPECTED_COMPONENTS = api-test-reset
#                           A single synthetic component id the test suite
#                           controls via POST /api/control/events.  The real
#                           demo-driver and fetcher-host stay in the stack but
#                           are NOT in this set, so their acks are ignored by the
#                           reset gate (they still react to reset-initiated —
#                           that is fine; the test drives completion
#                           independently via api-test-reset).
#                           The CSV value replaces the whole ExpectedComponents
#                           set wholesale, overriding the appsettings default
#                           ["dashboard-fetcher","demo-driver"] — no .NET
#                           index-overlay footgun (the old Reset__…__0/__1 form).
#   RESET_GATE_MAX_TTL_SECONDS = 15  Enough headroom for the longest test scenario
#                           (timeout backstop at ~3 s + overhead) without
#                           wedging ingest during teardown.
#
# ── GitHub emulator isolation ─────────────────────────────────────────────────
#   SEED_ON_STARTUP = false  The emulator starts EMPTY. The fetcher therefore
#                           backfills nothing by default, keeping demo-driver
#                           and reset-choreography tests unaffected by phantom
#                           fetcher data. The github-fetcher.spec.ts test
#                           explicitly seeds the emulator via
#                           POST /demo/github/seed {dataset:"demo"} and cleans
#                           up with POST /demo/github/clear + resetAll() in
#                           afterAll, so subsequent specs see a clean slate.
#
# ── Fetcher-host timing ───────────────────────────────────────────────────────
#   POLL_INTERVAL_SECONDS = 2   Fast poll so the github scenario doesn't wait
#                           long for backfill to appear.  The reset gate still
#                           ignores fetcher acks (ExpectedComponents above), so
#                           reset-choreography tests are unaffected by the
#                           fetcher's presence.
#   GITHUB_RATE_LIMIT_BUDGET_PCT = 100  Use the full simulated budget for speed.
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    environment:
      RESET_ACK_TIMEOUT_SECONDS: "3"
      # CSV replaces the whole expected-components set (no index-overlay footgun).
      RESET_EXPECTED_COMPONENTS: "api-test-reset"
      RESET_GATE_MAX_TTL_SECONDS: "15"

  github-emulator:
    environment:
      SEED_ON_STARTUP: "false"

  fetcher-host:
    environment:
      POLL_INTERVAL_SECONDS: "2"
      GITHUB_RATE_LIMIT_BUDGET_PCT: "100"
