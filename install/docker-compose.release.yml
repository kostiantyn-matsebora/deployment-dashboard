# Deployment Dashboard - release-install stack (image-only).
#
# Contract surfaces:
#   - GitHub issue #7    -- one-liner install (no git clone) for evaluators / internal adopters.
#   - ADR-0009           -- the API container self-applies EF Core migrations on startup; no separate runner / asset.
#   - docs/ci-cd-pipelines.md S 10 -- Release pipeline (assets + canonical URL pattern).
#
# This file is the release counterpart to `dev_env/docker-compose.local.yml`:
#   - NO `build:` blocks      -- every service references a pre-built GHCR image pinned by ${DASHBOARD_VERSION}.
#   - NO bind-mounts          -- the release host has no source tree.
#   - API self-migrates on start (per ADR-0009) -- no migrate profile, no migration runner.
#   - NO pgadmin              -- dropped per issue #7 (dev-convenience only).
#   - Profile-gated `fetcher`    service     -- enabled by the installer's `-Fetcher` switch.
#
# Image refs use `ghcr.io/kostiantyn-matsebora/deployment-dashboard-{api,fetcher,frontend,gateway}:${DASHBOARD_VERSION:-latest}`.
# The installer writes `DASHBOARD_VERSION` into `<InstallDir>/dashboard.env` so the same compose file
# resolves to the requested tag on every host.
#
# `DASHBOARD_PORT` lets the installer's `-Port` / `--port` argument retarget the host port collision-free.
# Defaults to 8080 to mirror local-dev's gateway URL.

name: deployment-dashboard

services:
  db:
    image: postgres:16-alpine
    container_name: dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dashboard}"
      POSTGRES_USER: "${POSTGRES_USER:-dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"                       # dev convenience -- parity with local-dev's psql / EF tooling story
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Single backend container hosting both Write and Read API surfaces (per
  # docs/architecture.md S 8). API-key middleware gates the write endpoint group only.
  # Internal-only (`expose:` no host port) -- the gateway routes path + method
  # onto the same `api` upstream per NFR-04.
  api:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-api:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection}"
      API_TOKEN: "${API_TOKEN}"
      HISTORY_RETENTION_DAYS: "365"
    expose:
      - "8080"                            # internal-only -- gateway routes all /api/* + /health here
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-frontend:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-frontend
    restart: unless-stopped
    expose:
      - "80"                              # internal-only -- gateway routes GET / + SPA shell here

  gateway:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-gateway:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-gateway
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"     # ONLY host-published app port
    depends_on:
      dashboard:
        condition: service_started
      api:
        condition: service_started

  # Optional pull-mode fetcher worker (CR-0009 / issue #7 release-install parity).
  # Opt-in via the `fetcher` Compose profile -- the installer adds `--profile fetcher`
  # when invoked with `-Fetcher` / `--fetcher`. Stays out of the default stack so the
  # baseline install remains a 4-service bring-up.
  #
  # Strict NFR-04 (per CR-0009 S 3a + architecture.md S 7):
  #   - NO `ports:`       -- fetcher has no inbound listener.
  #   - NO `healthcheck:` -- no HTTP surface to probe in MVP.
  #
  # `DASHBOARD_WRITE_API_KEY` reads the same random `API_TOKEN` the gateway accepts
  # (NOT the local-dev literal) -- the fetcher's POSTs go through the same single
  # ingress the browser uses, so the keys MUST match.
  #
  # `GHA_TOKEN` falls back to a placeholder when unset; the fetcher detects the
  # placeholder (or empty) and switches to anonymous-mode GitHub API calls
  # (omits the Authorization header, 60 req/h limit). The installer's normal
  # `-Fetcher` path requires a real GHA_TOKEN; `-Demo` permits the fall-back
  # explicitly for zero-PAT public-repo demo installs.
  fetcher:
    profiles: ["fetcher"]
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-fetcher:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-fetcher
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DASHBOARD_WRITE_API_URL: "http://gateway"
      DASHBOARD_WRITE_API_KEY: "${API_TOKEN}"
      PROGRESS_REPORTER: "dashboard-fetcher/github-actions"
      # `${FETCHER_POLL_INTERVAL_SECONDS:-30}` + `${GHA_REPOSITORIES:-<placeholder>}`
      # let install.ps1 -Demo override these via dashboard.env. Without the
      # substitution syntax the values are dead literals and the demo flag
      # cannot retarget the fetcher to a public-repo default.
      FETCHER_POLL_INTERVAL_SECONDS: "${FETCHER_POLL_INTERVAL_SECONDS:-30}"
      INITIAL_FETCH_LIMIT: "50"
      FETCHER_ADAPTERS: "github-actions"
      GHA_TOKEN: "${GHA_TOKEN:-local-dev-gha-token-placeholder}"
      GHA_REPOSITORIES: "${GHA_REPOSITORIES:-[{\"owner\":\"example-org\",\"repo\":\"example-repo\"}]}"
      # `${GHA_API_BASE_URL:-https://api.github.com}` is the env-var indirection
      # the integration profile (CR-0012 S 3a) re-points at `http://mock-gha:80`
      # without touching fetcher source code. Production / contributor flows
      # resolve to the default GitHub API endpoint.
      GHA_API_BASE_URL: "${GHA_API_BASE_URL:-https://api.github.com}"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    depends_on:
      gateway:
        condition: service_started

  # Mock GitHub API (WireMock.Net) -- deterministic upstream for the
  # `testing/integration/` cross-stack suite (CR-0012). Profile-gated by
  # `integration`: defined in this canonical inventory so the `dev_env/`
  # override + `.github/workflows/integration.yml` can layer on top per
  # ADR-0010 merge-override mechanics, but inert in the default release
  # bring-up (`docker compose up` without `--profile integration` never
  # starts the container).
  #
  # Strict NFR-04 production posture (per CR-0012 S 3a + Profile-gating
  # contract):
  #   - NO `ports:` here -- the release-install stack NEVER publishes the
  #     admin port to the host. The integration profile's host-mapping of
  #     port `18080` is added by `dev_env/docker-compose.local.yml` ONLY,
  #     and consumed by `dotnet test` running on the host. CI runners use
  #     the same override.
  #   - WireMock listens on port `80` inside the container by default
  #     (sheyenrath/wiremock.net:2.4.0 image convention); the fetcher
  #     reaches it via internal Docker DNS at `http://mock-gha:80` when
  #     `GHA_API_BASE_URL` is re-pointed there under the integration
  #     profile.
  #   - Image pin `sheyenrath/wiremock.net:2.4.0` per CR-0012 -- community
  #     image, same posture as `postgres:16-alpine` already in this stack.
  #   - Mappings mount path `/app/__admin/mappings` (NOT `/home/wiremock/...`)
  #     -- the .NET image lays out admin files under `/app`.
  #
  # Fixture mount + env tuning live in `dev_env/docker-compose.local.yml`
  # (integration profile overrides) so the release-install asset stays
  # minimal: contract here, deltas there.
  mock-gha:
    profiles: ["integration"]
    image: sheyenrath/wiremock.net:2.4.0
    container_name: dashboard-mock-gha
    restart: unless-stopped
    # WireMock.Net admin API is also the healthcheck surface -- `/__admin/mappings`
    # returns 200 with the current mapping list once the server is listening.
    # `wget -q --spider` is the alpine-BusyBox-friendly probe; the
    # `sheyenrath/wiremock.net:2.4.0` image ships on an Alpine-based .NET
    # runtime which carries BusyBox wget.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/__admin/mappings || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pg-data:
