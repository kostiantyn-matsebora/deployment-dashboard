name: deployment-dashboard

# ─────────────────────────────────────────────────────────────────────────────
# Profiles
#
#   standalone  — API only; connect to an external PostgreSQL instance.
#                 Required overrides: POSTGRES_HOST (+ credentials if non-default)
#                 Required overrides: API_KEY
#
#   full        — API + managed PostgreSQL (Docker-volume-backed).
#                 Required overrides: API_KEY, POSTGRES_PASSWORD
#
#   demo        — API + managed PostgreSQL, zero-config defaults.
#                 No overrides required. Suitable for local evaluation only.
#                 Default API key: demo-api-key  |  CORS: open  |  Retention: 30 days
#
# Usage:
#   docker compose --profile standalone up
#   docker compose --profile full      up
#   docker compose --profile demo      up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-api:latest
    profiles: [standalone, full, demo]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Connection string assembled from individual parts so each can be
      # overridden independently.  Override POSTGRES_HOST for standalone.
      ConnectionStrings__Postgres: >-
        Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-deployment_dashboard};Username=${POSTGRES_USER:-dashboard};Password=${POSTGRES_PASSWORD:-changeme}
      # Write-endpoint secret.  Override for full/standalone; demo default is intentionally weak.
      API_KEY: "${API_KEY:-demo-api-key}"
      # CSV of allowed CORS origins.  Empty disables CORS (gateway / same-origin).
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      # Minimum 90, default 365.  Demo uses a shorter window.
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # postgres is not started in the standalone profile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    profiles: [full, demo]
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-deployment_dashboard}"
      POSTGRES_USER:     "${POSTGRES_USER:-dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-deployment_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
