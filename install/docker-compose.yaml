name: deployment-dashboard

# ─────────────────────────────────────────────────────────────────────────────
# Profiles
#
#   standalone  — API only; connect to an external PostgreSQL instance.
#                 Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST
#
#   full        — API + managed PostgreSQL (Docker-volume-backed).
#                 Set: API_KEY, POSTGRES_USER, POSTGRES_PASSWORD
#
#   demo        — API + managed PostgreSQL. Suitable for local evaluation only.
#                 Use docker-compose.demo.yaml override — no vars required.
#                 CORS: open  |  Retention: 30 days
#
# Usage:
#   docker compose --profile standalone up
#   docker compose --profile full      up
#   docker compose -f docker-compose.yaml -f docker-compose.demo.yaml --profile demo up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-api:latest
    profiles: [standalone, full, demo]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Connection string assembled from individual parts so each can be
      # overridden independently.  Override POSTGRES_HOST for standalone.
      ConnectionStrings__Postgres: >-
        Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-deployment_dashboard};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Write-endpoint shared secret.  Required — validated on app startup.
      API_KEY: "${API_KEY}"
      # CSV of allowed CORS origins.  Empty disables CORS (gateway / same-origin).
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      # Minimum 90, default 365.  Demo uses a shorter window.
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # postgres is not started in the standalone profile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    profiles: [full, demo]
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-deployment_dashboard}"
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
