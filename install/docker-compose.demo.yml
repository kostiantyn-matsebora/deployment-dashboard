# Demo-mode compose overlay -- single source of truth for demo env config and services.
#
# Layered by:
#   install/install.ps1   (release):   docker compose -f release -f demo --profile db --profile fetcher
#   dev_env/start.ps1     (local dev): docker compose -f release -f demo -f local --profile db --profile fetcher
#
# Provides all env vars the release file needs for demo mode as inline literals,
# so neither script needs an --env-file or a secret-management helper.
#
# Demo services (demo-gha + demo-driver) are defined here -- NOT in the release
# file. The overlay's presence in the compose chain is the activation signal;
# no profile gating is applied to these two services. (ASR-B / issue #72)
#
# Replaces Resolve-DemoEnvDefaults + the demo path of Resolve-DashboardSecrets
# from the retired install/_bringup-core.ps1.

name: deployment-dashboard

services:
  db:
    environment:
      POSTGRES_PASSWORD: "local-dev-password"

  api:
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=dashboard;Username=dashboard;Password=local-dev-password"
      API_TOKEN: "demo-api-token"

  fetcher:
    environment:
      DASHBOARD_WRITE_API_KEY: "demo-api-token"
      GHA_API_BASE_URL: "http://demo-gha:80"
      FETCHER_POLL_INTERVAL_SECONDS: "5"
      GHA_REPOSITORIES: '[{"owner":"demo-org","repo":"web-portal"},{"owner":"demo-org","repo":"api-gateway"},{"owner":"demo-org","repo":"auth-service"},{"owner":"demo-org","repo":"billing-service"},{"owner":"demo-org","repo":"notification-worker"},{"owner":"demo-org","repo":"analytics-pipeline"}]'
    # Overlay-merge: adds demo-gha service_healthy gate to the fetcher's
    # depends_on map. Only active when this overlay is in the compose chain.
    depends_on:
      demo-gha:
        condition: service_healthy
        required: false

  # Demo GitHub Actions upstream (CR-0013) -- JVM WireMock with the demo
  # bundle baked into the image at build-time. Activated when this overlay
  # is included in the compose chain (no profile gating; overlay presence
  # == activation per issue #72 ASR-B mechanics).
  #
  # Issue #57: switched from sheyenrath/wiremock.net:2.4.0 to
  # wiremock/wiremock:3.10.0 -- WireMock.Net had an unfixed memory leak
  # in its request-handling internals under sustained fetcher polling load
  # (~22 MiB/min monotonic). JVM WireMock is GC-bounded and heap-capped
  # via JAVA_OPTS -Xmx256m.
  #
  # Strict NFR-04 production posture (per CR-0013 S 3b + CR-0012 mirror):
  #   - NO `ports:`     -- never published to the host. The fetcher reaches
  #                        the admin port via internal Docker DNS at
  #                        `http://demo-gha:80` when `GHA_API_BASE_URL`
  #                        is set to that under the demo overlay.
  #   - NO `volumes:`   -- the demo bundle is baked into the image's
  #                        `/home/wiremock/mappings/` layer (CR-0013 S 3c:
  #                        baked-image ship mechanism; no bind-mount).
  #   - Healthcheck     -- wget probe against `/__admin/health` (JVM
  #                        WireMock ships wget).
  #   - Image tag pin   -- `${DASHBOARD_VERSION:-latest}` so the demo
  #                        bundle is atomically versioned with the four
  #                        sibling component images.
  demo-gha:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-demo-gha:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-demo-gha
    restart: unless-stopped
    # `--port 80` pins the bind port to match the fetcher's
    # `GHA_API_BASE_URL=http://demo-gha:80`. JVM WireMock loads mappings
    # from `/home/wiremock/mappings/` automatically at startup.
    # `--max-request-journal 100` caps the request log so it does not grow
    # unboundedly under continuous fetcher polling.
    command:
      - "--port"
      - "80"
      - "--max-request-journal"
      - "100"
    environment:
      JAVA_OPTS: "-Xms32m -Xmx256m"
    # JVM WireMock ships wget; probe the admin health endpoint directly.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Demo-driver sidecar (issue #46) -- periodic JVM WireMock admin-API
  # ticker that loops a qa-authored sequence of tick directories so the
  # demo-mode dashboard surfaces ongoing deployment activity instead of a
  # single frozen baseline. Same overlay as `demo-gha`; both are activated
  # together when install/docker-compose.demo.yml is in the compose chain.
  #
  # Strict NFR-04 posture:
  #   - NO `ports:`       -- egress-only sidecar; no inbound listener.
  #   - NO `healthcheck:` -- demo-gha's TCP probe is the demo-profile
  #                          health signal.
  #   - depends_on: demo-gha service_healthy -- the driver's first PUT
  #                          would 404 / connection-refused otherwise.
  #
  # Env defaults baked into the Dockerfile; the rows here are explicit
  # so operators can override via dashboard.env without rebuilding.
  demo-driver:
    image: ghcr.io/kostiantyn-matsebora/deployment-dashboard-demo-driver:${DASHBOARD_VERSION:-latest}
    container_name: dashboard-demo-driver
    restart: unless-stopped
    environment:
      DEMO_DRIVER_GHA_URL: "http://demo-gha:80"
      DEMO_DRIVER_PERIOD_SECONDS: "15"
      DEMO_DRIVER_ID_STRIDE: "100"
    depends_on:
      demo-gha:
        condition: service_healthy
