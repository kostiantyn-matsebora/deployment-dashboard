# Dashboard Frontend nginx config — static SPA serving only.
#
# This container is reached only via the App Gateway (gateway/nginx.conf);
# the browser never talks to it directly. Its job is to serve the Angular
# bundle and provide HTML5 history-mode fallback to /index.html. No
# upstream proxying lives here — the App Gateway handles every /api/*
# and /health route.

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip the static assets the gateway will re-serve. The gateway gzips
    # at its edge too; double-gzip is not possible because nginx upstream
    # responses already-encoded with `Content-Encoding: gzip` are passed
    # through unchanged.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    5;
    # text/html is gzipped by default — listing it here triggers a duplicate
    # MIME type warning at boot. Only declare the extra types we want.
    gzip_types         application/javascript application/json text/css image/svg+xml;
    gzip_disable       "msie6";

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Hashed asset bundles (main.<hash>.js, styles.<hash>.css, etc.) can
    # be cached aggressively because their URLs change on every build.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires       1h;
        access_log    off;
        add_header    Cache-Control "public, max-age=3600";
        try_files     $uri =404;
    }

    # index.html must never be cached — it points at the hashed bundles
    # and is the only file we re-write on every deploy.
    location = /index.html {
        add_header    Cache-Control "no-cache, no-store, must-revalidate";
        expires       off;
    }

    # SPA history fallback — any unknown route serves index.html so the
    # Angular router can pick it up client-side. Files that exist on disk
    # (assets, index.html itself) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
