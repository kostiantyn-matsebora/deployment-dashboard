server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The web app manifest needs an explicit MIME type — nginx's default
    # mime.types has no .webmanifest entry. An nginx types{} block is a full
    # replacement of the MIME table at any scope, so it must cover only this
    # single file: an exact-match location does that without clobbering the
    # inherited png/css/js/svg mappings. Spec: issue #314.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache hashed assets forever, index.html never cached
    location ~* \.(js|css|woff2?|ico|png|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
