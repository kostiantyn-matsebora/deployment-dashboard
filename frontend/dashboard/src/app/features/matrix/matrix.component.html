<!-- MatrixComponent — services × environments deployment grid
     Spec: docs/design/views.md §Matrix View Layout -->

<!-- ── Loading state (matrix not yet populated by App shell) ── -->
@if (!state.matrixData()) {
  <div class="matrix-loading">
    <span class="load-spinner"></span>
    <span class="load-label">Loading matrix…</span>
  </div>
}

<!-- ── Matrix grid ────────────────────────────────────────── -->
@if (state.matrixData()) {
  <div class="matrix-shell fields-rich">
    <div
      class="matrix"
      [style.grid-template-columns]="gridColumns()"
    >

      <!-- Header row: empty service-column corner + env tags (drag-reorderable) -->
      <div class="col-head col-corner"></div>

      <!-- CDK drop list spans the visible env headers; orientation horizontal -->
      <div
        class="col-headers-drop"
        cdkDropList
        cdkDropListOrientation="horizontal"
        [cdkDropListData]="environments()"
        (cdkDropListDropped)="onColDrop($event)"
      >
        @for (env of environments(); track env) {
          <div
            class="col-head col-draggable"
            cdkDrag
            [cdkDragData]="env"
            [attr.aria-label]="'Column: ' + env + '. Drag to reorder.'"
            title="Drag to reorder"
          >
            <span
              class="col-drag-grip"
              cdkDragHandle
              aria-hidden="true"
              title="Drag to reorder"
            >⠿</span>
            <span class="env-tag">{{ env }}</span>
            <!-- CDK drag placeholder -->
            <div *cdkDragPlaceholder class="col-drag-placeholder"></div>
          </div>
        }
      </div>

      <!-- Service rows -->
      @for (row of filteredRows(); track row.service) {

        <!-- Row header — sticky left column -->
        <div class="row-head row" [attr.data-svc]="row.service">{{ row.service }}</div>

        <!-- Slot tiles for each visible ordered environment -->
        @for (env of environments(); track env) {
          <div class="row" [attr.data-svc]="row.service">
            @if (row.slots[env]) {
              <app-matrix-tile
                [slot]="row.slots[env]!"
                [visibleFields]="state.matrixVisibleFields()"
                [highlightedVersion]="highlightedVersion()"
                (tileClick)="openDrawer(row.service, env)"
                (versionHover)="onVersionHover($event)"
              />
            } @else {
              <div class="slot empty" aria-label="No deployment">
                <div class="empty-mark" aria-hidden="true">—</div>
              </div>
            }
          </div>
        }

      }
    </div>
  </div>
}

<!-- ── History drawer (position: fixed — outside flow) ────── -->
<app-history-drawer
  [open]="drawerOpen()"
  [service]="drawerSvc()"
  [environment]="drawerEnv()"
  (closed)="closeDrawer()"
/>
