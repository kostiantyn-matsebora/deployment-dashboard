<!-- SwimlanesComponent — per-service DAG visualisation.
     Spec: docs/design/views.md §Swimlanes View Layout -->

<!-- ── Loading state ──────────────────────────────────────── -->
@if (loading() && !lanes().length) {
  <div class="swim-loading">
    <span class="swim-spinner"></span>
    <span class="swim-load-label">Loading swimlanes…</span>
  </div>
}

<!-- ── Error state ────────────────────────────────────────── -->
@if (loadErr() && !lanes().length) {
  <div class="swim-loading swim-error">
    Failed to load deployment data.
  </div>
}

<!-- ── Vis shell: canvas (1fr) + inspector (320px) ────────── -->
@if (lanes().length) {
  <div class="vis-shell">

    <!-- ── Canvas: stacked service lanes ─────────────────── -->
    <div class="vis-canvas">
      @for (lane of lanes(); track lane.service) {
        <div class="lane">

          <!-- Lane header: service name -->
          <div class="lane-head">
            <span class="lane-svc">{{ lane.service }}</span>
          </div>

          <!-- Lane graph: one ngx-graph per service -->
          <div class="lane-graph" [style.min-height.px]="lane.graphH">
            <ngx-graph
              [nodes]="lane.nodes"
              [links]="lane.links"
              layout="dagre"
              [layoutSettings]="dagreSettings"
              [enablePan]="false"
              [enableZoom]="false"
              [autoZoom]="false"
              [autoCenter]="false"
              [enableDrag]="false"
              [animate]="false"
              [update$]="updateTrigger$"
            >
              <!-- ── Node template ─────────────────────── -->
              <ng-template #nodeTemplate let-node>
                <svg:foreignObject
                  [attr.width]="node.dimension.width"
                  [attr.height]="node.dimension.height"
                >
                  <xhtml:div
                    xmlns="http://www.w3.org/1999/xhtml"
                    style="width: 100%; height: 100%;"
                  >
                    <app-vis-card
                      [event]="node.data"
                      [visibleFields]="state.swimlaneVisibleFields()"
                      [isSelected]="node.data.id === state.selectedNodeId()"
                      (nodeClick)="onNodeSelect($event)"
                    />
                  </xhtml:div>
                </svg:foreignObject>
              </ng-template>

              <!-- ── Link template ─────────────────────── -->
              <ng-template #linkTemplate let-link>
                <svg:g class="swim-edge">
                  <svg:path
                    [attr.d]="link.line"
                    [attr.stroke]="getEdgeColor(link.data?.status)"
                    stroke-width="1.5"
                    fill="none"
                    marker-end="url(#swim-arrow)"
                  />
                </svg:g>
              </ng-template>

              <!-- ── Arrow marker defs ─────────────────── -->
              <ng-template #defsTemplate>
                <svg:defs>
                  <svg:marker
                    id="swim-arrow"
                    viewBox="0 -5 10 10"
                    refX="8" refY="0"
                    markerWidth="4" markerHeight="4"
                    orient="auto"
                  >
                    <svg:path d="M0,-5L10,0L0,5" fill="var(--ink-3)" />
                  </svg:marker>
                </svg:defs>
              </ng-template>

            </ngx-graph>
          </div>
          <!-- /lane-graph -->

        </div>
        <!-- /lane -->
      }
    </div>
    <!-- /vis-canvas -->

    <!-- ── Inspector panel ───────────────────────────────── -->
    <div class="vis-side">
      <app-inspector-panel [event]="state.selectedEvent()" />
    </div>

  </div>
  <!-- /vis-shell -->
}
