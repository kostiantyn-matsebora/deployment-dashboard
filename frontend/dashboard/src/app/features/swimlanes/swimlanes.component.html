<!-- SwimlanesComponent — per-service DAG visualisation.
     Spec: docs/design/views.md §Swimlanes View Layout -->

<!-- ── Loading state: only while the matrix hasn't arrived yet ── -->
@if (!lanes().length) {
  <div class="swim-loading">
    <span class="swim-spinner"></span>
    <span class="swim-load-label">Loading swimlanes…</span>
  </div>
}

<!-- ── Vis shell: canvas (1fr) + inspector (320px) ────────── -->
@if (lanes().length) {
  <div class="vis-shell">

    <!-- ── Stage: outer panel (2) wrapping inner lane rectangles (1) ── -->
    <div class="vis-stage">

      <!-- Panel header: title + time axis -->
      <div class="vis-stage-head">
        <span class="vis-stage-title">Deployments — per-service swimlanes</span>
        <span class="vis-stage-axis">older&nbsp;→&nbsp;newer&nbsp;(happened_at&nbsp;→)</span>
      </div>

      <!-- Body scrolls horizontally; header stays put -->
      <div class="vis-stage-body">
        <div class="vis-stage-inner">
      @for (lane of lanes(); track lane.service) {
        <div class="lane">

          <!-- Service name: top-left of the lane rectangle -->
          <div class="lane-svc-cell">
            <span class="lane-svc">{{ lane.service }}</span>
          </div>

          <!-- Lane graph: one ngx-graph PER independent chain (DAG), stacked.
               Each chain lays out independently so its root sits flush-left;
               [view] is sized from ngx-graph's OWN graphDims (via #g on
               drawComplete) — we never compute geometry ourselves. -->
          <div class="lane-graph">
            @for (dag of lane.dags; track dag.id) {
              <ngx-graph
                #g
                class="dag-graph"
                [nodes]="dag.nodes"
                [links]="dag.links"
                layout="dagre"
                [layoutSettings]="dagreSettings"
                [view]="viewFor(dag.id)"
                [enablePan]="false"
                [enableZoom]="false"
                [autoZoom]="false"
                [autoCenter]="false"
                [enableDrag]="false"
                [animate]="false"
                [update$]="updateTrigger$"
                (drawComplete)="onDraw(dag.id, g)"
              >
                <!-- ── Node template ─────────────────────── -->
                <ng-template #nodeTemplate let-node>
                  <svg:foreignObject
                    [attr.width]="node.dimension.width"
                    [attr.height]="node.dimension.height"
                    overflow="visible"
                  >
                    <xhtml:div
                      xmlns="http://www.w3.org/1999/xhtml"
                      style="width: 100%; height: 100%;"
                    >
                      <app-vis-card
                        [event]="node.data"
                        [visibleFields]="state.swimlaneVisibleFields()"
                        [isSelected]="node.data.id === state.selectedNodeId()"
                        (nodeClick)="onNodeSelect($event)"
                        (dims)="onCardDims($event)"
                      />
                    </xhtml:div>
                  </svg:foreignObject>
                </ng-template>

                <!-- ── Link template ─────────────────────── -->
                <ng-template #linkTemplate let-link>
                  <svg:g class="swim-edge">
                    <svg:path
                      [attr.d]="link.line"
                      [attr.stroke]="getEdgeColor(link.data?.status)"
                      stroke-width="1.5"
                      fill="none"
                      marker-end="url(#swim-arrow)"
                    />
                  </svg:g>
                </ng-template>

                <!-- ── Arrow marker defs ─────────────────── -->
                <ng-template #defsTemplate>
                  <svg:defs>
                    <svg:marker
                      id="swim-arrow"
                      viewBox="0 -5 10 10"
                      refX="8" refY="0"
                      markerWidth="4" markerHeight="4"
                      orient="auto"
                    >
                      <svg:path d="M0,-5L10,0L0,5" fill="var(--ink-3)" />
                    </svg:marker>
                  </svg:defs>
                </ng-template>

              </ngx-graph>
            }
          </div>
          <!-- /lane-graph -->

        </div>
        <!-- /lane -->
      }
        </div>
        <!-- /vis-stage-inner -->
      </div>
      <!-- /vis-stage-body -->
    </div>
    <!-- /vis-stage -->

    <!-- ── Inspector panel ───────────────────────────────── -->
    <div class="vis-side">
      <app-inspector-panel [event]="state.selectedEvent()" />
    </div>

  </div>
  <!-- /vis-shell -->
}
