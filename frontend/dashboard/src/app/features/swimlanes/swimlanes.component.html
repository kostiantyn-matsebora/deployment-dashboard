<!-- SwimlanesComponent — per-service DAG visualisation.
     Spec: docs/design/views.md §Swimlanes View Layout
           docs/design/views.md §Collapse / Expand (#309) -->

<!-- ── Loading state: only while the matrix hasn't arrived yet ── -->
@if (!lanesView().length) {
  <div class="swim-loading">
    <span class="swim-spinner"></span>
    <span class="swim-load-label">Loading swimlanes…</span>
  </div>
}

<!-- ── Vis shell: canvas (1fr) + inspector (320px) ────────── -->
@if (lanesView().length) {
  <div class="vis-shell">

    <!-- ── Stage: outer panel (2) wrapping inner lane rectangles (1) ── -->
    <div class="vis-stage">

      <!-- Panel header: title + time axis -->
      <div class="vis-stage-head">
        <span class="vis-stage-title">Deployments — per-service swimlanes</span>
        <span class="vis-stage-axis">older&nbsp;→&nbsp;newer&nbsp;(happened_at&nbsp;→)</span>
      </div>

      <!-- Body scrolls horizontally; header stays put -->
      <div class="vis-stage-body">
        <div class="vis-stage-inner">
      @for (lane of lanesView(); track lane.service) {
        <div class="lane" [attr.data-swim-service]="lane.service">

          <!-- Service name cell: chevron toggle + label -->
          <div class="lane-svc-cell">
            <button
              class="lane-chevron"
              [class.is-expanded]="!isCollapsed(lane.service)"
              (click)="toggleCollapsed(lane.service)"
              [attr.aria-label]="(isCollapsed(lane.service) ? 'Expand' : 'Collapse') + ' lane ' + lane.service"
              [attr.title]="(isCollapsed(lane.service) ? 'Expand' : 'Collapse') + ' lane '"
              aria-expanded="{{!isCollapsed(lane.service)}}"
            >›</button>
            <span class="lane-svc">{{ lane.service }}</span>
          </div>

          <!-- Lane graph: one ngx-graph PER independent chain (DAG), stacked.
               Collapsed: only the vector chain nodes/edges are in lane.dags.
               Expanded: full DAG set (unchanged from base spec).
               Each chain lays out independently so its root sits flush-left;
               [view] is sized from ngx-graph's OWN graphDims (via #g on
               drawComplete) — we never compute geometry ourselves. -->
          <div class="lane-graph">
            @for (dag of lane.dags; track dag.id) {
              <ngx-graph
                #g
                class="dag-graph"
                [nodes]="dag.nodes"
                [links]="dag.links"
                layout="dagre"
                [layoutSettings]="dagreSettings"
                [view]="viewFor(dag.id)"
                [enablePan]="false"
                [enableZoom]="false"
                [autoZoom]="false"
                [autoCenter]="false"
                [enableDrag]="false"
                [animate]="false"
                [update$]="updateTrigger$"
                (stateChange)="onStateChange(dag.id, $event, g)"
              >
                <!-- ── Node template ─────────────────────── -->
                <ng-template #nodeTemplate let-node>
                  <svg:foreignObject
                    [attr.width]="node.dimension.width"
                    [attr.height]="node.dimension.height"
                    overflow="visible"
                  >
                    <xhtml:div
                      xmlns="http://www.w3.org/1999/xhtml"
                      style="width: 100%; height: 100%;"
                    >
                      <app-vis-card
                        [event]="node.data"
                        [visibleFields]="state.swimlaneVisibleFields()"
                        [isSelected]="node.data.id === state.selectedNodeId()"
                        [isFlashing]="flashingIds().has(node.data.id)"
                        [nextEvent]="nextByEventId().get(node.data.id) ?? null"
                        [neverDeployed]="neverDeployedIds().has(node.data.id)"
                        (nodeClick)="onNodeSelect($event)"
                        (dims)="onCardDims($event)"
                      />
                    </xhtml:div>
                  </svg:foreignObject>
                </ng-template>

                <!-- ── Link template ─────────────────────── -->
                <ng-template #linkTemplate let-link>
                  <svg:g class="swim-edge">
                    <svg:path
                      [attr.d]="link.line"
                      [attr.stroke]="getEdgeColor(link.data?.status)"
                      stroke-width="1.5"
                      fill="none"
                      marker-end="url(#swim-arrow)"
                    />
                  </svg:g>
                </ng-template>

                <!-- ── Arrow marker defs ─────────────────── -->
                <ng-template #defsTemplate>
                  <svg:defs>
                    <svg:marker
                      id="swim-arrow"
                      viewBox="0 -5 10 10"
                      refX="8" refY="0"
                      markerWidth="4" markerHeight="4"
                      orient="auto"
                    >
                      <svg:path d="M0,-5L10,0L0,5" fill="var(--ink-3)" />
                    </svg:marker>
                  </svg:defs>
                </ng-template>

              </ngx-graph>
            }
          </div>
          <!-- /lane-graph -->

        </div>
        <!-- /lane -->
      }
        </div>
        <!-- /vis-stage-inner -->
      </div>
      <!-- /vis-stage-body -->
    </div>
    <!-- /vis-stage -->

    <!-- ── Inspector panel ───────────────────────────────── -->
    <div class="vis-side">
      <app-inspector-panel [event]="state.selectedEvent()" [nextEvent]="state.selectedNextEvent()" />
    </div>

  </div>
  <!-- /vis-shell -->
}
