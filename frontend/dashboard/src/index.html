<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Deployment Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter (UI) + JetBrains Mono (data identifiers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!--
    Pre-paint theme bootstrap — sets [data-theme] BEFORE any CSS evaluates
    so the very first frame matches the user's persisted choice.
    Spec: docs/design/behavior.md §Theme System
  -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('theme');
        if (v === 'light' || v === 'auto') {
          document.documentElement.setAttribute('data-theme', v);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
