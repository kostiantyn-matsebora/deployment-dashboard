<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Dashboard</title>
  <base href="/" />

  <!--
    FOIT-safe theme bootstrap — runs synchronously BEFORE Angular bootstraps
    so the first frame paints in the correct palette (no flash of incorrect
    theme). Mirrors docs/deployment-dashboard.html lines 187-198 verbatim.
      - Reads `dashboard.theme` from localStorage; valid values are
        `light` / `dark` / `auto`. Missing or corrupt -> `auto`.
      - Resolves `auto` against `prefers-color-scheme: dark`.
      - Sets two dataset props on <html>:
          data-theme       — effective palette ∈ {light, dark}
          data-theme-pref  — stored preference  ∈ {light, dark, auto}
    `ThemeService` (frontend/shared/.../theme.service.ts) takes over both
    writes once Angular bootstraps; this script only guarantees the first
    frame is correct.
  -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('dashboard.theme'); } catch (e) {}
      if (stored !== 'light' && stored !== 'dark' && stored !== 'auto') stored = 'auto';
      var osDark = false;
      try { osDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      var effective = stored === 'auto' ? (osDark ? 'dark' : 'light') : stored;
      document.documentElement.setAttribute('data-theme', effective);
      document.documentElement.setAttribute('data-theme-pref', stored);
    })();
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <dd-root></dd-root>
</body>
</html>
