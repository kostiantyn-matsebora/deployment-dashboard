<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Dashboard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="popup-root">
    <!-- Loading state -->
    <div id="state-loading" class="state-panel" hidden>
      <p class="ink-2">Loading…</p>
    </div>

    <!-- Not configured state -->
    <div id="state-unconfigured" class="state-panel" hidden>
      <p class="ink-2">Dashboard URL not configured.</p>
      <button id="btn-open-options" class="link-btn" type="button">Open settings</button>
    </div>

    <!-- Paused state -->
    <div id="state-paused" class="state-panel" hidden>
      <p class="ink-2">Watching is paused.</p>
      <button id="btn-open-options-paused" class="link-btn" type="button">Open settings</button>
    </div>

    <!-- No events yet -->
    <div id="state-empty" class="state-panel" hidden>
      <p class="ink-2">No deployments in watch scope yet.</p>
    </div>

    <!-- Latest change card — spec: docs/design/components.md §Latest-Change Popup Panel -->
    <div id="state-event" class="event-card glass-base" hidden>
      <div class="card-header">
        <!-- status chip; class driven by JS: status-chip s-{status} -->
        <span id="ev-status" class="status-chip" role="status"></span>
        <!-- service name — wire field: service (NOTE: mockup labels say "component"; real field is "service") -->
        <span id="ev-service" class="service-name"></span>
      </div>
      <div class="card-meta">
        <span id="ev-environment" class="meta-item"></span>
        <span class="meta-sep">·</span>
        <span id="ev-version" class="meta-item mono"></span>
      </div>
      <div class="card-actor">
        <span id="ev-actor" class="ink-2"></span>
      </div>
      <div class="card-time">
        <span id="ev-elapsed" class="elapsed ink-2"></span>
        <span class="meta-sep">·</span>
        <span id="ev-utc" class="utc ink-3"></span>
      </div>
      <div class="card-actions">
        <!-- hist-link class reuses SPA token — see styles.css -->
        <!-- label is set dynamically by popup.ts: "Open run #NNN" when run_number present, "Open run" otherwise -->
        <a id="ev-run-link" class="hist-link" target="_blank" rel="noopener noreferrer" hidden>Open run</a>
        <a id="ev-dashboard-link" class="hist-link" target="_blank" rel="noopener noreferrer">Open dashboard</a>
      </div>
    </div>

    <footer class="popup-footer">
      <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Open settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </footer>
  </div>
  <script type="module" src="../popup/popup.ts"></script>
</body>
</html>
