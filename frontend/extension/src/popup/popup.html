<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Dashboard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="popup-root">
    <!-- Loading state -->
    <div id="state-loading" class="state-panel" hidden>
      <p class="ink-2">Loading…</p>
    </div>

    <!-- Not configured state -->
    <div id="state-unconfigured" class="state-panel" hidden>
      <p class="ink-2">Dashboard URL not configured.</p>
      <button id="btn-open-options" class="link-btn" type="button">Open settings</button>
    </div>

    <!-- Paused state -->
    <div id="state-paused" class="state-panel" hidden>
      <p class="ink-2">Watching is paused.</p>
      <button id="btn-open-options-paused" class="link-btn" type="button">Open settings</button>
    </div>

    <!-- No in-scope events -->
    <div id="state-empty" class="state-panel" hidden>
      <p class="ink-2">No deployments in watch scope yet.</p>
    </div>

    <!-- Event list — spec: docs/design/components.md §Latest-Change Popup Panel -->
    <!-- Rows injected by popup.ts; each row uses the .event-row template pattern -->
    <div id="state-list" class="event-list" hidden></div>

    <footer class="popup-footer">
      <!-- Open dashboard link — shown whenever a URL is configured -->
      <a id="footer-dashboard-link" class="hist-link footer-dashboard" target="_blank" rel="noopener noreferrer" href="#" hidden>Open dashboard</a>
      <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Open settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </footer>
  </div>
  <script type="module" src="../popup/popup.ts"></script>
</body>
</html>
