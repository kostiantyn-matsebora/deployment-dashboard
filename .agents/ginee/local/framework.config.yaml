# ginee - framework.config.yaml
# Path: local/framework.config.yaml
# Authored by: team-lead (rediscovery, 2026-05-23)
# Purpose: map abstract concepts -> concrete project file paths.

# --- Source of truth ---
architecture-doc: docs/architecture.md
mockup: docs/ui/mockups/deployment-dashboard.html       # legacy HTML mockup - retire under sibling issue #80 once #79 merges
mockup-spa: mockup/                                     # standalone Angular 20 mockup-app per CR-0015 / ADR-0011 - new visual contract; transitional dual-key state per CR-0015 § 3f until #80 collapses
# api-contract: omitted - API contract lives inside architecture.md §7.
work-breakdown-doc: docs/WBS.md
ci-cd-integration-doc: docs/ci-cd-integration.md

# --- Change governance ---
adr-directory: docs/adr/
cr-directory: docs/cr/
# diagrams-directory: omitted - diagrams embedded as ASCII art inside docs/architecture.md.

# --- Task & workflow ---
todo: TODO
nested-todos-glob: null
project-instruction-file: CLAUDE.md

# --- Repository structure ---
server-tier-path: backend/
client-tier-path: frontend/
mockup-app-path: mockup/                # standalone Angular 20 mockup-app per CR-0015 / ADR-0011 - port 4201; own package.json + node_modules
infrastructure-path: infrastructure/   # planned per WBS §4 / NFR-06 - directory does not yet exist
local-dev-path: dev_env/
testing-path: testing/
ci-workflows-path: .github/workflows/
gateway-path: gateway/                  # nginx reverse proxy (single public ingress) + demo-gha + demo-driver sidecar images
install-path: install/                  # release-install canonical compose + install.ps1/.sh entrypoints

# --- Stack identity ---
stack:
  server-language: C# / .NET 10
  server-framework: ASP.NET Core Minimal API (co-located Write + Read API services - microservices architecture per ADR-0006, co-location mechanics per ADR-0002)
  client-framework: Angular 20 standalone + NgRx Signal Store + Tailwind CSS
  data-store: PostgreSQL 16 (SQLite in-memory for unit tests)
  real-time-mechanism: SSE over PostgreSQL LISTEN/NOTIFY
  iac-tool: Terraform azurerm >= 4.x (planned per NFR-06)
  ci-tool: GitHub Actions (live - 11 workflows: _build-and-push-image.yml reusable + api/fetcher/frontend/gateway/demo-gha/demo-driver component callers per CR-0010 + CR-0013 + issue #46; integration.yml per CR-0012; release.yml per ADR-0005; scripts.yml for Pester/bats; pages.yml for Jekyll docs site)
  container-runtime: Docker (Docker Compose v2 for local; Azure Container Apps for prod)
  docs-site: Jekyll + Just the Docs theme (GitHub Pages - docs/_config.yml + docs/Gemfile + docs/index.md nav-ordered; pages.yml workflow)
  sidecar-runtime: Python 3 (gateway/demo-driver/entrypoint.py - JVM WireMock admin-API ticker; per CR-0013 §3e amendment / issue #46)

# --- Hard constraints ---
constraints:
  hosting-cloud: Azure
  cost-cap-usd-per-month: 30
  retention-days-minimum: 90
  internal-only: true
  stateless-backend: true

# --- Tooling commands ---
local-dev-startup-command: pwsh -NoProfile -File dev_env/start.ps1
local-dev-stop-command: pwsh -NoProfile -File dev_env/stop.ps1

test-runners:
  functional: testing/functional/run-tests.ps1
  e2e: testing/e2e/run-tests.ps1
  mockup-visual: testing/mockup-visual/run-tests.ps1
  integration: testing/integration/run-tests.ps1   # CR-0012 cross-stack runtime verification (mock-gha + fetcher + api + gateway + db)
  unit-backend: dotnet test backend/Dashboard.sln
  unit-frontend: npm test --prefix frontend -- --watch=false --browsers=ChromeHeadlessNoSandbox
  unit-mockup: npm test --prefix mockup -- --watch=false --browsers=ChromeHeadless    # standalone mockup-app Karma suite per CR-0015 / ADR-0011 (post issue #79)
  # smoke / script-suite: not yet present (referenced in template but not authored)

# --- DevOps script quality (D18) ---
devops-scripts:
  tests-path: testing/scripts/          # Pester *.Tests.ps1 + *.bats - install/uninstall (release) + dev_env start/stop (contributor)
  coverage-threshold: 90
  coverage-tool-bash: bashcov           # install.bats + uninstall.bats run on ubuntu-latest via .github/workflows/scripts.yml

# --- Backend unit-test coverage (D19) ---
unit-backend:
  runner: dotnet test --collect:"XPlat Code Coverage"
  coverage-threshold: 90

# --- Project-doc index (D13) ---
# Adopter-declared index classes (extends built-in heuristics; takes precedence).
# Built-in classes (architecture, adr, cr, mockup, constraints, glossary) are
# detected automatically and need no entry here.
index:
  dir: local/index
  classes:
    - name: ui-options
      category: doc
      source-glob: docs/ui/{compact,focus-layout,theme,tree-topology,version-display,env-tag-column-alignment,rate-limit-cluster}*.md
      template: novel
      consumed-by: [frontend-engineer, solution-architect]
    - name: wbs
      category: doc
      source: docs/WBS.md
      template: novel
      consumed-by: [team-lead, solution-architect]
    - name: ci-cd-integration
      category: doc
      source: docs/ci-cd-integration.md
      template: novel
      consumed-by: [devops-engineer, backend-engineer]
    - name: ci-pipelines
      category: doc
      source: docs/ci-cd-pipelines.md
      template: novel
      consumed-by: [devops-engineer, backend-engineer]
    - name: integration-tests
      category: doc
      source: docs/integration-tests.md
      template: novel
      consumed-by: [qa-engineer, devops-engineer]
    - name: install-guide
      category: doc
      source: docs/install.md
      template: novel
      consumed-by: [devops-engineer, team-lead]
    - name: features
      category: doc
      source: docs/features.md
      template: novel
      consumed-by: [solution-architect, frontend-engineer]
    - name: docs-site
      category: code
      source-glob: 'docs/_config.yml + docs/Gemfile + docs/index.md + docs/getting-started.md'
      template: novel
      consumed-by: [devops-engineer, solution-architect]
    - name: governance-files
      category: doc
      source-glob: 'README.md + CONTRIBUTING.md + SECURITY.md + CODE_OF_CONDUCT.md + CHANGELOG.md'
      template: novel
      consumed-by: [team-lead, solution-architect]
    - name: github-templates
      category: code
      source-glob: '.github/ISSUE_TEMPLATE/*.{md,yml} + .github/PULL_REQUEST_TEMPLATE.md'
      template: novel
      consumed-by: [team-lead, devops-engineer]

# --- Delivery modes (D17) ---
# Framework default applies until adopter pins a preference:
#   - issue/TODO-sourced tasks default to Mode 1 (branch + PR)
#   - freeform user instructions default to Mode 2 (wt only)
# delivery:
#   default-mode: branch

# --- Triage scoring (D23) ---
triage:
  scoring-formula: value-over-complexity

# --- GitHub integration (D14) ---
github:
  repo: kostiantyn-matsebora/deployment-dashboard
  framework-repo: kostiantyn-matsebora/ginee
  ready-label: ginee:ready
  in-progress-label: ginee:in-progress
  blocked-label: ginee:blocked

# --- Dispatch tracking (D39) ---
# Sub-issue dispatch posture for github.repo-sourced tasks. `sub-issues` is the
# framework default per core/github-integration.md § Sub-issue dispatch; pinned
# here to lock for future pickups after issue #72's in-context-this-cycle
# exception (skill-runner overreach mid-cycle, surfaced + acknowledged on #72).
dispatch:
  tracking: sub-issues
