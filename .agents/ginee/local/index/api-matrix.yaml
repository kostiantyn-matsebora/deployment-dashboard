# class: api-matrix
# source: docs/architecture.md §7 API Contract (+ CR-0003 topology + CR-0008 validation/OpenAPI + CR-0009 fetcher cursor + X-Progress-Reporter + CR-0011 fetcher usage + ADR-0008 leaky-bucket cap + republish-on-tick)
# recipe: builtin:architecture

endpoints:
  - method: POST
    path: /api/deployments
    surface: Write
    auth: X-Api-Key (required)
    success: 201 Created
    errors: [401 missing/invalid key, 422 invalid payload]
    request-shape-ref: '@docs/architecture.md#api-contract (POST body table)'
    optional-request-headers:
      - 'X-Progress-Reporter: ≤ 64 chars, non-whitespace (CR-0009) - persisted on event row when present; surfaced on Read responses'
    notes: |
      Required fields: service, environment, version, status (in-progress|success|failure),
      run_url, run_number, actor. Optional (CR-0004): ref, sha. CR-0003 adds deployment_id (required) +
      parent_deployments (optional). CR-0008 standardised length-only validation + RFC-7807 errors.
      CR-0009 adds optional request header X-Progress-Reporter (≤ 64 chars, non-whitespace) - persisted to
      new nullable progress_reporter column; same length validation pattern as body fields; ValidationProblemDetails
      422 on violation; errors map uses wire-literal header name "X-Progress-Reporter" (CR-0009 § 3a).
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments
    surface: Read
    auth: none
    success: 200 OK
    response-shape-ref: '@docs/architecture.md#api-contract (Matrix response shape — per service)'
    query-params:
      - correlationAttribute (CR-0003) — per-request override of topology correlation attribute
    notes: Matrix = latest entry per (service,environment). Includes topology.edges per service (CR-0003). Per-event surfaces include progress_reporter (nullable) per CR-0009.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments/{service}/{environment}
    surface: Read
    auth: none
    success: 200
    errors: [404 no history]
    notes: Current state for one slot. Per-event surface includes progress_reporter (nullable) per CR-0009.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments/{service}/{environment}/history
    surface: Read
    auth: none
    success: 200
    errors: [404 no history]
    query-params: ["limit (default 50)"]
    notes: Last N events for a slot. Per-event surface includes progress_reporter (nullable) per CR-0009.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/environments
    surface: Read
    auth: none
    success: 200
    notes: Distinct environments derived from stored data (FR-09)
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/services
    surface: Read
    auth: none
    success: 200
    notes: Distinct services derived from stored data (FR-09)
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/stream
    surface: Read
    auth: none
    success: 200 text/event-stream
    notes: |
      SSE; supports Last-Event-ID for reconnection (NFR-05). Emits slot-update events with full per-slot
      state object identical to GET /api/deployments shape. CR-0003: SSE carries slot updates only; topology
      refreshes via a separate GET. Gateway tuning: proxy_buffering off, proxy_read_timeout 1h. Per-event
      surfaces inside slot-update.state.current / .lastSuccessful include progress_reporter (nullable) per CR-0009.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/fetcher/state/{source-id}
    surface: Write (pull-mode adapter only, CR-0009)
    auth: X-Api-Key (required)
    required-request-headers:
      - 'X-Progress-Reporter: ≤ 64 chars, non-whitespace (CR-0009) - identifies which pusher cursor to read'
    success: 200 OK
    errors: [401 missing/invalid key, 404 no state exists yet, 422 missing/over-cap X-Progress-Reporter]
    response-shape: '{ "cursor": "<string>", "updated_at": "<iso-8601 UTC>" }'
    notes: Returns opaque cursor blob for (progress_reporter, source-id). Route registered as catch-all ({**sourceId}) so source-id values containing forward slashes (owner/repo) bind correctly. Handler enforces 200-char cap + non-whitespace on source-id. Per ADR-0004 - backend never parses cursor beyond length.
    source: '@docs/architecture.md#api-contract'

  - method: PUT
    path: /api/fetcher/state/{source-id}
    surface: Write (pull-mode adapter only, CR-0009)
    auth: X-Api-Key (required)
    required-request-headers:
      - 'X-Progress-Reporter: ≤ 64 chars, non-whitespace (CR-0009) - identifies which pusher cursor to upsert'
    success: 200 OK
    errors: [401 missing/invalid key, 422 missing/over-cap cursor or missing/over-cap header]
    request-shape: '{ "cursor": "<string, ≤ 4096>" }'
    response-shape: 'Canonical GET shape - { "cursor": "...", "updated_at": "..." }'
    notes: Upserts opaque cursor for (progress_reporter, source-id) into fetcher_state table. Cursor is VARCHAR(4096) NOT NULL keyed by (progress_reporter, source_id). Each adapter owns its cursor shape (ADR-0004 Decision 2).
    source: '@docs/architecture.md#api-contract'

  - method: POST
    path: /api/fetcher/usage
    surface: Write (pull-mode adapter only, CR-0011)
    auth: X-Api-Key (required)
    required-request-headers:
      - 'X-Progress-Reporter: ≤ 64 chars, non-whitespace - identifies pushing fetcher'
    success: 200 OK
    errors: [401 missing/invalid key, 422 missing/over-cap fields]
    request-shape: '{ "adapter_id", "source_id", "upstream_limit", "upstream_remaining", "upstream_reset_at", "self_imposed_cap", "upstream_used", "observed_at" }'
    response-shape: 'empty body'
    notes: 'Fetcher pushes current upstream rate-limit observation + self-imposed cap on every poll tick (republish-on-tick recovers in-memory cache after replica restart). Backend caches latest snapshot per (adapter_id, source_id); no persistence. Paired ADR-0008 (leaky-bucket cap + republish-on-tick); paired CR-0011.'
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/fetcher/usage
    surface: Read (CR-0011)
    auth: none
    success: 200 OK
    response-shape: '{ "snapshots": [ { adapter_id, source_id, upstream_limit, upstream_remaining, upstream_reset_at, self_imposed_cap, upstream_used, observed_at, received_at } ] }'
    notes: 'Latest cached snapshot per (adapter_id, source_id). Empty array {"snapshots":[]} when no fetcher has pushed yet - never 404. received_at = server-side POST-landing timestamp (lets clients stale-out cluster after 2 x poll_interval; independent of SSE wire per CR-0003 boundary).'
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /health
    surface: Read
    auth: none
    success: 200
    response: '{"status":"ok"}'
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /
    surface: SPA (via gateway → dashboard:80)
    auth: none
    success: 200
    notes: Serves SPA shell + Angular bundle with HTML5 history fallback to index.html
    source: '@docs/architecture.md#api-contract'

cross-cutting:
  rest-constraints:
    - Stateless — no sessions, no cookies
    - Uniform interface — POST=create, GET=read
    - Resource-oriented URIs
    - Meaningful status codes (201/401/404/422)
  validation:
    standard: length-only (CR-0008)
    errors: RFC-7807 ProblemDetails
    spec: OpenAPI 3.x + Scalar UI
    header-validation-key-convention: 'CR-0009 § 3a - header validation failures use the wire-literal header name as ValidationProblemDetails errors map key (e.g. "X-Progress-Reporter"); body-field rules use JSON property name per CR-0008.'
    source: '@docs/cr/CR-0008-api-validation-and-openapi-scalar.md'
  topology-payload:
    shape: '{ edges: [ { from, to, source: explicit|correlated } ] } per service'
    source: '@docs/adr/ADR-0001-topology-derivation-five-pass.md'
  sse-event-shape: '@docs/architecture.md#api-contract (SSE slot-update data payload)'
  event-attribution:
    header: X-Progress-Reporter
    cap: 64 chars, non-whitespace
    optional-on: POST /api/deployments
    required-on: GET/PUT /api/fetcher/state/{source-id}, POST /api/fetcher/usage
    persistence: nullable progress_reporter VARCHAR(64) column on events/deployments table
    surfaced-on: [DeploymentEventResponse, CurrentDeployment (matrix.current + slot endpoint + SSE state.current), LastSuccessfulDeployment (matrix.lastSuccessful + SSE state.lastSuccessful)]
    convention: '<source-component>/<adapter-or-context> - e.g. dashboard-fetcher/github-actions, ci-pipeline/gha-composite, manual/<operator-name>; free-form permitted'
    source: '@docs/cr/CR-0009-pull-mode-fetcher-and-progress-reporter.md'
  fetcher-usage:
    push-endpoint: POST /api/fetcher/usage
    read-endpoint: GET /api/fetcher/usage
    cache-shape: in-memory per (adapter_id, source_id); no persistence
    recovery: republish-on-tick (fetcher repushes every poll tick) restores cache after replica restart
    client-staleness-rule: 2 x poll_interval since received_at -> treat snapshot as stale
    sse-boundary: usage snapshots do NOT ride SSE wire (per CR-0003 SSE-carries-slot-updates-only); clients poll GET endpoint
    paired-with: '@docs/adr/ADR-0008-leaky-bucket-cap-and-republish-on-tick.md (NEW — not in manifest); @docs/cr/CR-0011-fetcher-rate-limit-governance.md (NEW — not in manifest)'
    source: '@docs/architecture.md#api-contract'