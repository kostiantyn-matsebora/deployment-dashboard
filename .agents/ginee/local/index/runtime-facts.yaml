# class: runtime-facts
# source-glob: install/docker-compose.release.yml (env: blocks) + dev_env/docker-compose.local.yml (env: blocks) + backend/README.md (env-var table) + gateway/demo-driver/entrypoint.py (DEMO_DRIVER_* env-vars)
# recipe: builtin:runtime-facts
# reindexed: 2026-05-23 (added install/docker-compose.release.yml env blocks; added DEMO_DRIVER_* env-vars from gateway/demo-driver/entrypoint.py; updated migration-actuation notes for ADR-0009; added DASHBOARD_PORT + DASHBOARD_VERSION release-compose vars)

env-vars:
  - name: ConnectionStrings__DefaultConnection
    consumed-by: [api, migrations, write-api, read-api]
    tier: server
    required: true
    default: '(none - must be provided; release-install: read from dashboard.env written by installer; local-dev: literal Host=db;Database=dashboard;Username=dashboard;Password=local-dev-password)'
    secret: true (real prod; dev uses obviously-fake password)
    notes: 'Npgsql connection string. ADR-0009: consumed by Database.Migrate() on startup before app.Run() in addition to the query path. DesignTimeDbContextFactory falls back to localhost:5432 when unset (design-time only).'
    source-anchor: '@dev_env/docker-compose.local.yml:125 + @install/docker-compose.release.yml:api service + @backend/README.md:57'
  - name: API_TOKEN
    consumed-by: [api, write-api]
    tier: server
    required: true (Write surface)
    default: '(none - must be provided; release-install: random hex generated by installer and persisted to dashboard.env)'
    secret: true (real prod; dev uses local-dev-token-not-for-production)
    notes: 'Static API key. Every POST /api/deployments must include X-Api-Key matching this value (FR-10). Read surface unaffected.'
    source-anchor: '@dev_env/docker-compose.local.yml:126 + @install/docker-compose.release.yml:api service + @backend/README.md:58'
  - name: HISTORY_RETENTION_DAYS
    consumed-by: [api, read-api]
    tier: server
    required: false
    default: '365 (per SAD §10 Decision 2)'
    secret: false
    notes: 'Retention window for daily pruning job. NFR-07 requires >= 90. Values <= 0 disable pruning.'
    source-anchor: '@dev_env/docker-compose.local.yml:127 + @install/docker-compose.release.yml:api service + @backend/README.md:59'
  - name: ASPNETCORE_URLS
    consumed-by: [api]
    tier: server
    required: true (in container)
    default: 'http://+:8080 (inside container)'
    secret: false
    notes: 'Binds Kestrel to 8080 inside the container (SAD §7). When running outside Docker, set explicitly.'
    source-anchor: '@dev_env/docker-compose.local.yml:124 + @backend/README.md:65'
  - name: ASPNETCORE_ENVIRONMENT
    consumed-by: [api, fetcher]
    tier: server
    required: false
    default: 'Production (ASP.NET Core default); set to Development in local compose'
    secret: false
    source-anchor: '@dev_env/docker-compose.local.yml:123 + 208'
  - name: POSTGRES_DB
    consumed-by: [db]
    tier: data-store
    required: true
    default: dashboard (local dev)
    secret: false
    source-anchor: '@dev_env/docker-compose.local.yml:42 + @install/docker-compose.release.yml:db service'
  - name: POSTGRES_USER
    consumed-by: [db]
    tier: data-store
    required: true
    default: dashboard (local dev)
    secret: false
    source-anchor: '@dev_env/docker-compose.local.yml:42 + @install/docker-compose.release.yml:db service'
  - name: POSTGRES_PASSWORD
    consumed-by: [db]
    tier: data-store
    required: true
    default: 'local-dev-password (obviously fake; release-install: random hex from installer written to dashboard.env; prod is in Azure Key Vault)'
    secret: true
    source-anchor: '@dev_env/docker-compose.local.yml:43 + @install/docker-compose.release.yml:db service'
  - name: PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD / PGADMIN_CONFIG_SERVER_MODE
    consumed-by: [pgadmin]
    tier: dev-tooling
    required: true
    default: 'admin@example.com / admin / False (dev convenience only; local-dev compose only; not in release compose)'
    secret: false (dev-only)
    source-anchor: '@dev_env/docker-compose.local.yml:164-167'
  - name: DOTNET_NOLOGO / DOTNET_CLI_TELEMETRY_OPTOUT
    consumed-by: [fetcher]
    tier: build-tooling
    required: false
    default: '1 / 1 (suppress logo + telemetry in CI logs)'
    secret: false
    source-anchor: '@dev_env/docker-compose.local.yml:224-225'

  # ----- Release-install compose env-vars -----
  - name: DASHBOARD_VERSION
    consumed-by: [installer compose; release compose image refs + demo-gha image ref]
    tier: release-install
    required: false (installer writes it)
    default: 'latest (fallback when dashboard.env not sourced)'
    secret: false
    notes: 'Written by install.ps1/sh to <InstallDir>/dashboard.env after gh release download resolves the tag. ${DASHBOARD_VERSION:-latest} substitution pins ALL five component images (api/fetcher/frontend/gateway + demo-gha) to the same tag atomically.'
    source-anchor: '@install/docker-compose.release.yml:image refs'
  - name: DASHBOARD_PORT
    consumed-by: [gateway in release compose]
    tier: release-install
    required: false
    default: '8080'
    secret: false
    notes: 'Host-side port mapping ${DASHBOARD_PORT:-8080}:80 on the gateway service. -Port / --port installer flag retargets on collision.'
    source-anchor: '@install/docker-compose.release.yml:gateway service'

  # ----- Fetcher container env-vars (CR-0009 / CR-0011 / ADR-0008) -----
  - name: DASHBOARD_WRITE_API_URL
    consumed-by: [fetcher]
    tier: fetcher
    required: true
    default: 'http://gateway (local dev; resolves to internal Docker DNS gateway:80)'
    secret: false
    notes: 'Base URL the fetcher uses to POST /api/deployments + GET/PUT /api/fetcher/state + POST /api/fetcher/usage; goes through the same single ingress as browser + CI/CD pushers (FR-06).'
    source-anchor: '@dev_env/docker-compose.local.yml:209 + @install/docker-compose.release.yml:fetcher service'
  - name: DASHBOARD_WRITE_API_KEY
    consumed-by: [fetcher]
    tier: fetcher
    required: true
    default: 'local-dev-token-not-for-production (local dev; reuses literal API_TOKEN)'
    secret: true
    notes: 'X-Api-Key value the fetcher sends; same key the seed script + curl example use locally.'
    source-anchor: '@dev_env/docker-compose.local.yml:210 + @install/docker-compose.release.yml:fetcher service'
  - name: PROGRESS_REPORTER
    consumed-by: [fetcher]
    tier: fetcher
    required: true
    default: 'dashboard-fetcher/github-actions (slash-namespaced per CR-0009 §3e)'
    secret: false
    notes: 'X-Progress-Reporter header value the fetcher attaches to every push. Cap 64 chars non-whitespace.'
    source-anchor: '@dev_env/docker-compose.local.yml:211'
  - name: FETCHER_POLL_INTERVAL_SECONDS
    consumed-by: [fetcher]
    tier: fetcher
    required: false
    default: '30 (60 in release -RealGha; 5-10 in demo profile; 1 in integration profile per CR-0012)'
    secret: false
    notes: 'Adapter poll interval; rate-limit cap accounting per CR-0011 / ADR-0008.'
    source-anchor: '@dev_env/docker-compose.local.yml:212 + @install/docker-compose.release.yml:profile env overrides'
  - name: INITIAL_FETCH_LIMIT
    consumed-by: [fetcher]
    tier: fetcher
    required: false
    default: '50 (ceiling 500)'
    secret: false
    notes: 'First-fetch cap when GET /api/fetcher/state returns 404 (no cursor yet).'
    source-anchor: '@dev_env/docker-compose.local.yml:213'
  - name: FETCHER_RATE_LIMIT_ABSOLUTE
    consumed-by: [fetcher]
    tier: fetcher
    required: false
    default: 'null (unset; FETCHER_RATE_LIMIT_PERCENTAGE active instead)'
    secret: false
    notes: 'CR-0011 §3a governance env-var. Integer requests-per-upstream-window cap. When both set, absolute wins over percentage. Behaviour on cap: stop issuing CI/CD calls + resume at X-RateLimit-Reset without cursor advance + single INFO log per window.'
    source-anchor: '@dev_env/docker-compose.local.yml:218 + @install/docker-compose.release.yml:fetcher service'
  - name: FETCHER_RATE_LIMIT_PERCENTAGE
    consumed-by: [fetcher]
    tier: fetcher
    required: false
    default: '30 (1..100 valid range)'
    secret: false
    notes: 'CR-0011 §3a governance env-var. Percent of upstream X-RateLimit-Limit the fetcher is allowed to consume per window. Active when FETCHER_RATE_LIMIT_ABSOLUTE is unset.'
    source-anchor: '@dev_env/docker-compose.local.yml:219 + @install/docker-compose.release.yml:fetcher service'
  - name: FETCHER_ADAPTERS
    consumed-by: [fetcher]
    tier: fetcher
    required: true (fetcher profile)
    default: 'github-actions (MVP single adapter)'
    secret: false
    notes: 'Comma-separated list of adapter ids the fetcher composes; MVP supports github-actions only.'
    source-anchor: '@dev_env/docker-compose.local.yml:220'
  - name: GHA_TOKEN
    consumed-by: [fetcher]
    tier: fetcher
    required: false (placeholder if unset)
    default: 'local-dev-gha-token-placeholder (anonymous mode active when truly unset upstream of compose); not required in demo profile (demo-gha is the upstream)'
    secret: true (real PAT; placeholder is fake)
    notes: 'GitHub PAT (scope repo:deployments). When unset and -Demo or -AllowMissingGhaToken passed to start.ps1, fetcher uses anonymous GitHub API (60 req/h) per ci-cd-integration.md § Anonymous-mode transport. Not required under the demo profile (fetcher polls demo-gha via GHA_API_BASE_URL).'
    source-anchor: '@dev_env/docker-compose.local.yml:221 + @install/docker-compose.release.yml:fetcher service'
  - name: GHA_REPOSITORIES
    consumed-by: [fetcher]
    tier: fetcher
    required: true (fetcher profile)
    default: '[{"owner":"example-org","repo":"example-repo"}] (compose placeholder); [{"owner":"demo-org","repo":"demo-repo"}] (demo profile per CR-0013)'
    secret: false
    notes: 'JSON array of (owner, repo) pairs the GHA adapter polls. Each pair pairs with one cursor on the backend via (progress_reporter, source-id) where source-id=owner/repo.'
    source-anchor: '@dev_env/docker-compose.local.yml:222 + @install/docker-compose.release.yml:fetcher+demo profile env overrides'
  - name: GHA_API_BASE_URL
    consumed-by: [fetcher]
    tier: fetcher
    required: false
    default: 'https://api.github.com (real upstream); http://mock-gha:80 under integration profile; http://demo-gha:80 under demo profile'
    secret: false
    notes: 'GitHub API base URL seam. CR-0012 / CR-0013 retarget this to mock-gha / demo-gha internally; no fetcher source change needed.'
    source-anchor: '@dev_env/docker-compose.local.yml:223 + @install/docker-compose.release.yml:profile env overrides'

  # ----- Demo-driver env-vars (CR-0013 §3e amendment / issue #46) -----
  - name: DEMO_DRIVER_GHA_URL
    consumed-by: [demo-driver]
    tier: demo
    required: false
    default: 'http://demo-gha:80'
    secret: false
    notes: 'WireMock.Net admin API base URL for the demo-driver sidecar. Must resolve to demo-gha container admin port.'
    source-anchor: '@gateway/demo-driver/entrypoint.py:39'
  - name: DEMO_DRIVER_PERIOD_SECONDS
    consumed-by: [demo-driver]
    tier: demo
    required: false
    default: '15'
    secret: false
    notes: 'Sleep between ticks in seconds; SIGTERM aborts the sleep but lets current tick IO finish (graceful <=10s).'
    source-anchor: '@gateway/demo-driver/entrypoint.py:40'
  - name: DEMO_DRIVER_ID_STRIDE
    consumed-by: [demo-driver]
    tier: demo
    required: false
    default: '100'
    secret: false
    notes: 'Cycle-anchored monotone stride for rewriting numeric id/run_id fields under Response.BodyAsJson per tick. Prevents ID collision across scenario walk cycles.'
    source-anchor: '@gateway/demo-driver/entrypoint.py:41'
  - name: DEMO_DRIVER_BUILD_EPOCH
    consumed-by: [demo-driver]
    tier: demo
    required: false
    default: '0'
    secret: false
    notes: 'Base epoch for numeric id rewriting. Allows each demo-gha image build to anchor its ID range without overlap.'
    source-anchor: '@gateway/demo-driver/entrypoint.py:42'

ci-cd-callee-secrets:
  - name: DEPLOYMENT_DASHBOARD_URL
    consumed-by: [external CI/CD pipeline notify step]
    tier: caller
    required: true
    default: '(per pipeline; no trailing slash)'
    secret: false
    source-anchor: '@docs/ci-cd-integration.md#secrets'
  - name: DEPLOYMENT_DASHBOARD_TOKEN
    consumed-by: [external CI/CD pipeline notify step]
    tier: caller
    required: true
    default: '(per pipeline; sent in X-Api-Key header - must match server API_TOKEN)'
    secret: true
    source-anchor: '@docs/ci-cd-integration.md#secrets'

cross-cutting:
  env-schema-source: '(no .env.example exists by design - see dev_env/README.md:22-29; zero-setup, no .env files; all values inline in compose files; release-install uses dashboard.env written by installer not committed)'
  secrets-store:
    local-dev: 'NONE - values inline in dev_env/docker-compose.local.yml (obviously fake); GHA_TOKEN read from shell $env interpolation in compose'
    prod: 'Azure Key Vault (per NFR-06; provisioned via Terraform - planned)'
    ci-callers: 'Each CI/CD tool''s native secret store (GHA secrets, ADO variable groups, Jenkins Credentials Binding, GitLab CI variables)'
    release-install: 'dashboard.env written by installer to <InstallDir>/ (POSTGRES_PASSWORD + API_TOKEN + ConnectionStrings__DefaultConnection + DASHBOARD_VERSION); sourced by docker compose via --env-file flag'
  config-validation:
    backend: 'ConnectionStrings__DefaultConnection consumed by Database.Migrate() on startup (ADR-0009) and by DesignTimeDbContextFactory; falls back to localhost:5432 when unset (dev-design only)'
    write-api: 'API_TOKEN required at startup; missing -> API-key middleware returns 401 on every write request'
    read-api: 'HISTORY_RETENTION_DAYS parsed at startup; values <= 0 disable pruning (per backend/README.md:59)'
    fetcher: 'FetcherOptions / FetcherRateLimitOptions validation at startup (CR-0011 §3a); INFO log line emitted with resolved cap on boot; OptionsValidationException at build if CircuitBreaker.SamplingDuration < 2x AttemptTimeout (resilience-handler tuning invariant per ci-cd-integration.md)'

  rules:
    - 'NEVER add .env / .env.local files in dev_env/ (per bindings.md Do-not-introduce)'
    - 'Real production secrets only via Azure Key Vault - Terraform + GitHub Actions Environments wire them in'
    - 'SPA bundle never embeds API_TOKEN (NFR-04; Read surface unauthenticated)'
    - 'Fetcher container has no inbound port + no healthcheck (NFR-04 strict; outbound-only)'
    - 'demo-gha admin port NEVER published to host in production/release posture (NFR-04); only under integration compose profile for test-runner access'
