# class: stack
# source-glob: backend/Dashboard.sln + backend/**/*.csproj + backend/api/Dockerfile + backend/fetcher-host/Dockerfile + frontend/{,**/}package.json + frontend/dashboard/Dockerfile + testing/{e2e,mockup-visual,integration,functional}/{package.json,*.csproj} + gateway/Dockerfile + gateway/demo-gha/Dockerfile + gateway/demo-driver/Dockerfile
# recipe: builtin:package-manifest
# reindexed: 2026-05-23 (added fetcher tier manifests + Dashboard.Api.Tests; added demo-gha + demo-driver to gateway tier; added integration + functional test project rows under testing tier)

tiers:
  server:
    language: C# / .NET 10 (net10.0)
    runtime: ASP.NET Core 10 (mcr.microsoft.com/dotnet/aspnet:10.0)
    framework: ASP.NET Core Minimal API (co-located Write + Read API services - microservices architecture per ADR-0006, co-location mechanics per ADR-0002)
    primary-libs:
      - Microsoft.AspNetCore.OpenApi 10.0.7 (CR-0008)
      - Scalar.AspNetCore 2.14.14 (CR-0008)
      - Microsoft.EntityFrameworkCore 10.0.0 + Design + Relational + Sqlite
      - Microsoft.EntityFrameworkCore.Design 10.0.0 (PrivateAssets=all; on Dashboard.Api host so contributors can run `dotnet ef migrations add` on the host - local-dev contributor toolchain per ADR-0009 + CR-0010 §3l; NOT used for CI migration-script generation, which was retired by ADR-0009)
      - Npgsql.EntityFrameworkCore.PostgreSQL 10.0.0
    startup-migrations: 'Database.Migrate() called between app.Build() and app.Run() per ADR-0009; failure aborts process LogLevel.Critical before app.Run(); no opt-out; idempotent via __EFMigrationsHistory; concurrent replicas race-safe via PG unique-constraint'
    structure:
      - 'backend/api/Dashboard.Api (host project - Microsoft.NET.Sdk.Web; references write-api + read-api + shared)'
      - 'backend/write-api/Dashboard.WriteApi (library - endpoint group)'
      - 'backend/read-api/Dashboard.ReadApi (library - endpoint group)'
      - 'backend/shared/Dashboard.Shared (library - DbContext + entities + migrations + middleware + NOTIFY/LISTEN + SSE writer)'
      - 'backend/api/Dashboard.Api.Tests (xUnit per-host tests: startup-applied migration path + fetcher usage endpoints + rate-limit governance per CR-0011)'
      - 'backend/{write-api,read-api,shared}/Dashboard.*.Tests (xUnit unit tests; SQLite in-memory)'
    dockerfile: '@backend/api/Dockerfile (FROM mcr.microsoft.com/dotnet/sdk:10.0 build -> aspnet:10.0 runtime; EXPOSE 8080)'
    solution: '@backend/Dashboard.sln'
    manifests:
      - '@backend/api/Dashboard.Api/Dashboard.Api.csproj'
      - '@backend/api/Dashboard.Api.Tests/Dashboard.Api.Tests.csproj'
      - '@backend/write-api/Dashboard.WriteApi/Dashboard.WriteApi.csproj'
      - '@backend/write-api/Dashboard.WriteApi.Tests/Dashboard.WriteApi.Tests.csproj'
      - '@backend/read-api/Dashboard.ReadApi/Dashboard.ReadApi.csproj'
      - '@backend/read-api/Dashboard.ReadApi.Tests/Dashboard.ReadApi.Tests.csproj'
      - '@backend/shared/Dashboard.Shared/Dashboard.Shared.csproj'
      - '@backend/shared/Dashboard.Shared.Tests/Dashboard.Shared.Tests.csproj'
    dep-count: 3 (Dashboard.Api: OpenApi + Scalar + EFCore.Design) + 5 (Dashboard.Shared); host references libraries via ProjectReference (3)
    notes: |
      OpenApi + Scalar packages live on the host project (CR-0008).
      EF Core stack lives on Dashboard.Shared (DbContext + migrations); EF Design also on Dashboard.Api host
      for contributor-side `dotnet ef migrations add` workflow (retained post-ADR-0009).
      ADR-0009: Database.Migrate() replaces the former external migrations service + migration.sql asset.
      No FluentValidation / AutoMapper / MediatR (banned per CLAUDE.md).
      GenerateDocumentationFile=true on host + shared to feed OpenAPI semantic enrichment.

  fetcher:
    language: C# / .NET 10 (net10.0)
    runtime: ASP.NET Core 10 Worker (Microsoft.NET.Sdk.Worker)
    framework: Hosted worker service - optional pull-mode adapter (CR-0009, ADR-0004); minReplicas==maxReplicas==1 when enabled
    primary-libs:
      - Microsoft.Extensions.Http.Resilience (Polly v8 internally - retry + circuit-breaker)
      - HttpClient (typed clients for Write-API + GitHub-API)
      - Dashboard.Shared (DTO reuse - no DTO duplication)
    rate-limit-governance: 'CR-0011 / ADR-0008: FETCHER_RATE_LIMIT_ABSOLUTE / FETCHER_RATE_LIMIT_PERCENTAGE; leaky-bucket on upstream Remaining; POST /api/fetcher/usage per tick; IFetcherUsageCache singleton on API (in-memory, re-warmed within one poll interval)'
    structure:
      - 'backend/fetcher/Dashboard.Fetcher (library - ICiCdAdapter interface + GitHubActionsAdapter + scheduler + rate-limit cap logic per CR-0011/ADR-0008)'
      - 'backend/fetcher/Dashboard.Fetcher.Tests (xUnit unit + functional)'
      - 'backend/fetcher-host/Dashboard.Fetcher.Host (Worker host - composition root; env-var configuration; Write API client)'
    dockerfile: '@backend/fetcher-host/Dockerfile (FROM mcr.microsoft.com/dotnet/sdk:10.0 build -> aspnet:10.0 runtime; image=deployment-dashboard-fetcher)'
    manifests:
      - '@backend/fetcher/Dashboard.Fetcher/Dashboard.Fetcher.csproj'
      - '@backend/fetcher/Dashboard.Fetcher.Tests/Dashboard.Fetcher.Tests.csproj'
      - '@backend/fetcher-host/Dashboard.Fetcher.Host/Dashboard.Fetcher.Host.csproj'
    notes: |
      Three solution projects added in 2026-05 (CR-0009 / WBS §1.5). Tracked in Dashboard.sln.
      Rate-limit governance added by CR-0011 / ADR-0008.

  client:
    language: TypeScript ~5.8 (strict)
    framework: Angular 20 (standalone components, zoneless change detection)
    state-lib: '@ngrx/signals ^20.0.0'
    styling: Tailwind CSS ^3.4 (no darkMode - single [data-theme=dark] CSS overlay; see ADR-0003)
    structure:
      - 'frontend/dashboard (application shell; main.ts; styles.css; proxy.conf.json)'
      - 'frontend/matrix (library @dd/matrix - pipeline matrix + views + picker)'
      - 'frontend/drawer (library @dd/drawer - history drawer)'
      - 'frontend/shared (library @dd/shared - Signal Store + API client + SSE service + models + fixtures)'
    dockerfile: '@frontend/dashboard/Dockerfile (FROM node:22-alpine build -> nginx:alpine runtime; EXPOSE 80)'
    manifests:
      - '@frontend/package.json (workspace root; build/test/lint/start scripts)'
      - '@frontend/dashboard/ng-package.json + tsconfig.app.json + tsconfig.spec.json'
      - '@frontend/matrix/package.json (peerDeps: @angular/{common,core} + @dd/shared)'
      - '@frontend/drawer/package.json (peerDeps: @angular/{common,core} + @dd/shared)'
      - '@frontend/shared/package.json (peerDeps: @angular/{common,core} + @ngrx/signals)'
      - '@frontend/angular.json (workspace: 1 app dashboard + 3 libraries shared/matrix/drawer; karmaConfig wired across all 4 projects per CR-0010 §1.6.4)'
    dep-count-frontend-root: 9 deps + 14 devDeps (@angular/* + @ngrx/signals + tslib + zone.js + Karma/Jasmine + ng-packagr + autoprefixer + postcss + tailwindcss + typescript)
    notes: |
      Workspace-level deps in /frontend/package.json. Nested libraries declare peer-deps only.
      Tailwind content globs: dashboard/src + matrix/src + drawer/src + shared/src (**/*.{html,ts}).
      Path aliases: @dd/{shared,matrix,drawer} -> */src/public-api.ts (no deep imports).
      No darkMode mode set; theme handled via [data-theme=dark] CSS overlay (mockup parity).

  gateway:
    image: nginx:alpine
    role: Sole public ingress; path+method routing matrix; SSE pass-through
    config: '@gateway/nginx.conf (full http{} block; SSE-friendly: proxy_buffering off, proxy_read_timeout 1h)'
    dockerfile: '@gateway/Dockerfile (FROM nginx:alpine; EXPOSE 80; self-healthcheck on /__gateway_health)'

  gateway-sidecars:
    demo-gha:
      image: 'sheyenrath/wiremock.net:2.4.0 (base image baked into first-party ghcr.io/.../deployment-dashboard-demo-gha:${DASHBOARD_VERSION})'
      role: 'Baked WireMock.Net demo bundle image; 6 services × 5+ envs; 80-150 deployment events; CI/CD caller: gateway/demo-gha/Dockerfile; demo Compose profile only (CR-0013)'
      dockerfile: '@gateway/demo-gha/Dockerfile (FROM sheyenrath/wiremock.net:2.4.0; COPY testing/fixtures/gha/demo/ /app/__admin/mappings/; build context: repo root)'
      ci-caller: '@.github/workflows/demo-gha.yml (5th CR-0010 caller)'
    demo-driver:
      language: Python 3 (stdlib only - http.client + json + os + pathlib + time + signal + logging)
      role: 'Periodic WireMock.Net admin-API ticker sidecar (issue #46 / CR-0013 §3e amendment); walks ticks/ subdirectories; PUT/POST to demo-gha admin API; graceful SIGTERM; no crash on tick errors'
      dockerfile: '@gateway/demo-driver/Dockerfile'
      env-vars:
        - DEMO_DRIVER_GHA_URL (default http://demo-gha:80)
        - DEMO_DRIVER_PERIOD_SECONDS (default 15)
        - DEMO_DRIVER_ID_STRIDE (default 100; cycle-anchored monotone numeric id rewriting)
        - DEMO_DRIVER_BUILD_EPOCH (default 0)
      ci-caller: '@.github/workflows/demo-driver.yml (6th CR-0010 caller; CR-0013 §3e amendment per issue #46)'

  testing:
    integration:
      language: C# (xUnit)
      project: '@testing/integration/Dashboard.Integration.Tests/Dashboard.Integration.Tests.csproj'
      role: 'Cross-stack runner: fetcher -> mock-gha -> gateway -> API -> DB -> SSE; CR-0012 substrate; FETCHER_POLL_INTERVAL_SECONDS=1 for NFR-03 5s envelope'
      runner: '@testing/integration/ (run-tests.ps1 or integration.yml)'
    functional:
      language: C# (xUnit)
      runner: '@testing/functional/run-tests.ps1'
      projects: '@testing/functional/Dashboard.Functional.Tests/Dashboard.Functional.Tests.csproj'
    e2e:
      language: TypeScript 5.6.3
      tool: '@playwright/test 1.49.1'
      package: '@testing/e2e/package.json'
      runner: '@testing/e2e/run-tests.ps1'
    mockup-visual:
      tool: '@playwright/test 1.49.1'
      package: '@testing/mockup-visual/package.json'
      runner: '@testing/mockup-visual/run-tests.ps1'
    scripts:
      seed: '@testing/scripts/seed.ps1'
      cleanup: '(planned per WBS §10 - cleanup.ps1 not yet present)'

excluded-paths:
  - 'node_modules/**'
  - 'dist/**'
  - 'bin/**, obj/** (backend build output)'

cross-cutting:
  port-contract:
    api-container: 8080 (ASPNETCORE_URLS=http://+:8080)
    dashboard-container: 80 (internal; nginx static)
    gateway: 80 internal / 8080 host-published (dev); ${DASHBOARD_PORT:-8080}:80 in release compose
    fetcher-container: '(no inbound port - outbound only; NFR-04 strict; no healthcheck)'
    demo-gha-container: 80 (WireMock.Net; internal-only in demo profile; host-mapped to 18080 only under integration profile per NFR-04)
    demo-driver-container: '(no inbound port; outbound to demo-gha admin API only)'
  banned-libs:
    - Serverless / Functions / Lambda
    - FluentValidation / AutoMapper / MediatR
    - CORS configuration
    - Swashbuckle / NSwag (replaced by Microsoft.AspNetCore.OpenApi + Scalar per CR-0008)
    source: '@.agents/ginee/local/bindings.md (Do not introduce table)'
  stack-version-floors:
    dotnet: 10.0
    angular: 20.0
    postgres: 16 (alpine)
    node: 22 (alpine, build only)
    nginx: alpine
    wiremock-net: '2.4.0 (sheyenrath/wiremock.net; pinned in compose; same tag for mock-gha and demo-gha base)'
