# class: commands
# source-glob: frontend/{,**/}package.json§scripts + testing/{e2e,mockup-visual}/package.json§scripts + install/install.{ps1,sh} + install/uninstall.{ps1,sh} + dev_env/*.ps1 + testing/**/run-tests.ps1 + testing/scripts/{seed.ps1,*.Tests.ps1,*.bats} + .config/dotnet-tools.json + framework.config.yaml§test-runners + .github/workflows/*.yml
# recipe: builtin:commands
# reindexed: 2026-05-23 (added release-install commands; updated dev_env scripts for ADR-0010 dual-file invocation + new flags; added integration runner; added dotnet-tools.json as tool-pin entry; updated start.ps1 switch enumeration for CR-0013 flag rename)

build:
  - name: frontend-build
    cmd: 'npm run build'
    delegates-to: 'ng build dashboard'
    wd: frontend/
    tool: angular/build
    source-anchor: '@frontend/package.json:9'
  - name: frontend-watch
    cmd: 'npm run watch'
    delegates-to: 'ng build dashboard --watch --configuration development'
    wd: frontend/
    tool: angular/build
    source-anchor: '@frontend/package.json:10'
  - name: backend-build
    cmd: 'dotnet build'
    delegates-to: 'msbuild Dashboard.sln'
    wd: backend/
    tool: dotnet
    source-anchor: '@backend/README.md:42'

dev:
  - name: stack-up
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1'
    delegates-to: 'docker compose -f install/docker-compose.release.yml -f dev_env/docker-compose.local.yml up -d --build + poll /health (ADR-0010 dual-file invocation)'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/start.ps1'
  - name: stack-up-scaled
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1 -Scaled'
    delegates-to: 'docker compose -f dev_env/docker-compose.scaled.yml up (standalone; single-file; NOT ADR-0010 layered)'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/start.ps1:-Scaled'
  - name: stack-up-integration
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1 -Integration'
    delegates-to: 'docker compose -f install/docker-compose.release.yml -f dev_env/docker-compose.local.yml --profile integration up -d --build; starts mock-gha service; host-maps admin port 18080->80; sets GHA_API_BASE_URL=http://mock-gha:80 + FETCHER_POLL_INTERVAL_SECONDS=1'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/start.ps1:-Integration'
  - name: stack-up-real-gha
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1 -RealGha'
    delegates-to: 'docker compose --profile fetcher up -d --build (requires $env:GHA_TOKEN); renamed from -Fetcher per CR-0013 installer flag inversion'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/start.ps1:-RealGha'
  - name: stack-up-demo
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1 -Demo'
    delegates-to: 'docker compose --profile demo up; starts demo-gha + demo-driver services; GHA_REPOSITORIES=[{owner:demo-org,repo:demo-repo}]; GHA_API_BASE_URL=http://demo-gha:80; FETCHER_POLL_INTERVAL_SECONDS=5-10; no GHA_TOKEN required; back-compat alias per CR-0013'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/start.ps1:-Demo'
  - name: stack-down
    cmd: 'pwsh -NoProfile -File dev_env/stop.ps1'
    delegates-to: 'docker compose -f install/docker-compose.release.yml -f dev_env/docker-compose.local.yml down --remove-orphans (ADR-0010 dual-file); -Volumes opts in to volume removal; -Scaled tears down the scaled compose separately'
    wd: '<repo-root>'
    tool: powershell + docker-compose
    source-anchor: '@dev_env/stop.ps1'
  - name: frontend-start
    cmd: 'npm start'
    delegates-to: 'ng serve dashboard'
    wd: frontend/
    tool: angular/dev-server
    source-anchor: '@frontend/package.json:8'

install:
  - name: release-install-demo-default
    cmd: 'pwsh -NoProfile -File install.ps1'
    or: 'bash install.sh'
    delegates-to: 'gh release download <assets>; gh auth token | docker login ghcr.io; docker compose --profile demo up -d --build; poll /health'
    stack: 'Demo stack (CR-0013 default): demo-gha + demo-driver + fetcher pointed at demo-gha; >=20 populated slots within 60s; no GHA_TOKEN required'
    source-anchor: '@install/install.ps1 + @install/install.sh'
  - name: release-install-real-gha
    cmd: 'pwsh -NoProfile -File install.ps1 -RealGha'
    or: 'bash install.sh --real-gha'
    stack: 'Real GitHub Actions upstream; requires $env:GHA_TOKEN; fetcher profile active'
    source-anchor: '@install/install.ps1:-RealGha'
  - name: release-install-empty
    cmd: 'pwsh -NoProfile -File install.ps1 -Empty'
    or: 'bash install.sh --empty'
    stack: 'Bare stack: api+gateway+frontend+db; no fetcher; no demo-gha; direct POST /api/deployments integrators'
    source-anchor: '@install/install.ps1:-Empty'
  - name: release-install-demo-back-compat
    cmd: 'pwsh -NoProfile -File install.ps1 -Demo'
    or: 'bash install.sh --demo'
    stack: 'Back-compat alias -> routes to default demo stack + logs one informational line; NOT documented in quick-start; migration aid per CR-0013'
    source-anchor: '@install/install.ps1:-Demo'
  - name: release-uninstall
    cmd: 'pwsh -NoProfile -File uninstall.ps1'
    or: 'bash uninstall.sh'
    delegates-to: 'docker compose -f docker-compose.release.yml down + clean-up install directory'
    source-anchor: '@install/uninstall.ps1 + @install/uninstall.sh'

test:
  - name: backend-unit
    cmd: 'dotnet test backend/Dashboard.sln'
    scope: backend xUnit (SQLite in-memory)
    tool: xUnit
    source-anchor: '@.agents/ginee/local/framework.config.yaml:59 (unit-backend)'
  - name: frontend-unit
    cmd: 'npm test --prefix frontend -- --watch=false --browsers=ChromeHeadlessNoSandbox'
    delegates-to: 'ng test dashboard'
    scope: frontend Karma/Jasmine
    tool: Karma + Jasmine
    source-anchor: '@.agents/ginee/local/framework.config.yaml:60 + @frontend/package.json:11'
  - name: integration
    cmd: 'pwsh -NoProfile -File dev_env/start.ps1 -Integration && pwsh -NoProfile -File testing/integration/run-tests.ps1'
    scope: 'Cross-stack xUnit: fetcher -> mock-gha -> gateway -> API -> DB -> SSE; CR-0012 substrate; FETCHER_POLL_INTERVAL_SECONDS=1'
    prereq: 'dev_env/start.ps1 -Integration (mock-gha service up; integration profile active)'
    tool: xUnit
    source-anchor: '@testing/integration/ + .github/workflows/integration.yml'
  - name: functional
    cmd: 'pwsh -NoProfile -File testing/functional/run-tests.ps1'
    delegates-to: 'dotnet test testing/functional/Dashboard.Functional.Tests'
    scope: functional API tests against running stack
    prereq: dev_env/start.ps1 (stack up)
    tool: xUnit
    source-anchor: '@testing/functional/run-tests.ps1 + framework.config.yaml:56'
  - name: e2e
    cmd: 'pwsh -NoProfile -File testing/e2e/run-tests.ps1'
    delegates-to: 'npx playwright test'
    scope: Playwright E2E against running stack
    prereq: dev_env/start.ps1 (stack up) + testing/scripts/seed.ps1
    tool: '@playwright/test 1.49.1'
    source-anchor: '@testing/e2e/run-tests.ps1 + framework.config.yaml:57'
  - name: mockup-visual
    cmd: 'pwsh -NoProfile -File testing/mockup-visual/run-tests.ps1'
    delegates-to: 'npx playwright test'
    scope: Mockup geometric invariants (no stack required)
    tool: '@playwright/test 1.49.1'
    source-anchor: '@testing/mockup-visual/run-tests.ps1 + framework.config.yaml:58'

lint:
  - name: frontend-lint
    cmd: 'npm run lint'
    delegates-to: 'ng lint'
    wd: frontend/
    tool: angular/cli (no explicit ESLint/Prettier config present)
    source-anchor: '@frontend/package.json:12'
  - name: frontend-typecheck
    cmd: 'tsc --noEmit -p tsconfig.json'
    scope: testing/{e2e,mockup-visual} TS typecheck only
    tool: typescript
    source-anchor: '@testing/e2e/package.json:10 + @testing/mockup-visual/package.json:8'

data:
  - name: seed
    cmd: 'pwsh -NoProfile -File testing/scripts/seed.ps1'
    scope: POST prefilled deployment events to running stack via Ingest API; reads testing/config/local.json (writeBaseUrl + apiKey); reads testing/fixtures/seed-data.json
    prereq: dev_env/start.ps1 (stack up)
    tool: PowerShell + Invoke-RestMethod
    source-anchor: '@testing/scripts/seed.ps1'

migration:
  - name: ef-migrations-add
    cmd: 'dotnet ef migrations add <MigrationName> --project backend/shared/Dashboard.Shared --startup-project backend/api/Dashboard.Api'
    scope: 'Add a new EF Core migration for local-dev contributor use; requires .NET 10 SDK + dotnet-ef 10.0.0 (dotnet tool restore from .config/dotnet-tools.json); actuation = API self-migrates on startup per ADR-0009 (no dotnet ef database update needed)'
    tool: dotnet-ef (from .config/dotnet-tools.json)
    source-anchor: '@.config/dotnet-tools.json (dotnet-ef pin)'
  - name: dotnet-tool-restore
    cmd: 'dotnet tool restore'
    scope: 'Restore dotnet-ef from .config/dotnet-tools.json manifest; prerequisite for ef-migrations-add'
    tool: dotnet
    source-anchor: '@.config/dotnet-tools.json'

ci:
  - composite-action: '@.github/actions/notify/ (CR-0001 + WBS §1.4.2; called by adopter pipelines)'
  - callers: 'api.yml + fetcher.yml + frontend.yml + gateway.yml + demo-gha.yml + demo-driver.yml (6 callers per CR-0010 + CR-0013 §3e)'
  - reusable: '.github/workflows/_build-and-push-image.yml'
  - integration-ci: '.github/workflows/integration.yml (CR-0012; watching-week non-blocking -> blocking)'
  - scripts-ci: '.github/workflows/scripts.yml (Pester + bats; no image build)'

notes-no-makefile-or-justfile: Repo uses npm scripts + dotnet CLI + PowerShell .ps1 runners; no Makefile / justfile present.
ci-runner-prefixes-rule: testing/* runners all require a running stack (dev_env/start.ps1) AND a fixed config under testing/config/local.json; do NOT accept -BaseUrl / -ApiKey loose flags.
start-ps1-switches: '-Scaled (NFR-05 validation; standalone single-file; NOT ADR-0010 layered) | -Integration (CR-0012; --profile integration; mock-gha; FETCHER_POLL_INTERVAL_SECONDS=1) | -RealGha (CR-0013 rename of -Fetcher; real GHA upstream; requires $env:GHA_TOKEN) | -Empty (CR-0013; bare stack; no fetcher; no demo-gha) | -Demo (CR-0013 back-compat alias; demo profile; no PAT) | -HealthTimeoutSeconds (default 60)'
