# class: constraints
# source: docs/architecture.md (§5 NFR + §6 Constraints)
# recipe: builtin:architecture

categories:
  hosting:
    - id: NFR-01
      budget: Azure-only — all infra on Microsoft Azure
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { devops-engineer: Single-cloud IaC; no AWS/GCP abstractions }
    - id: CONSTRAINT-6-platform-agnostic
      budget: No serverless / Functions / Lambda — OCI containers only
      source: '@docs/architecture.md#6-constraints'
      impact: { devops-engineer: All components must run on any OCI host }

  cost:
    - id: NFR-02
      budget: Total Azure infra cost <= $30/month
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { devops-engineer: ACA Consumption + B1ms Postgres baseline; cost tracking required }

  latency:
    - id: NFR-03
      budget: Live updates delivered to all clients within 5s of ingest
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { backend-engineer: SSE + LISTEN/NOTIFY (no polling); frontend-engineer: EventSource bootstrap }

  network:
    - id: NFR-04
      budget: Internal-only — no public internet exposure; SPA ships no API key
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { devops-engineer: Only gateway gets public ingress; backend-engineer: read group unauth; frontend-engineer: SPA never embeds dev API key }

  statelessness:
    - id: NFR-05
      budget: Backend stateless; multiple instances behind LB without sticky sessions
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { backend-engineer: No in-memory caches/fan-out; SSE reconnects via Last-Event-ID }

  iac:
    - id: NFR-06
      budget: All infra defined as code via Terraform
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { devops-engineer: Terraform azurerm >= 4.x; no Portal-clicks }

  retention:
    - id: NFR-07
      budget: Deployment history retained >= 90 days per slot
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { backend-engineer: HISTORY_RETENTION_DAYS env-var default 365; daily pruning job }

  build:
    - id: NFR-08
      budget: Dashboard loads with no in-browser build step
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { frontend-engineer: ng-build to static bundle; theme bootstrap uses plain inline JS }

  ux-reflow:
    - id: NFR-09
      budget: |
        Layout must reflow under any (services x envs x name-len x version-len x viewport>=1024px) combination
        without overlap/clipping/occlusion. Env-tag + box pairs use CSS Grid (auto env-tag col, fixed leaf-width
        box col); connector geometry anchored to getBoundingClientRect via ResizeObserver + window-resize listener.
        Mirrored verbatim at top of docs/ui/deployment-dashboard.html (the mockup is the visual contract).
      source: '@docs/architecture.md#5-non-functional-requirements'
      impact: { frontend-engineer: Geometric invariant enforced by construction; qa-engineer: mockup-visual harness covers }

  stack:
    - id: CONSTRAINT-6-stack
      budget: Angular 20+ frontend; .NET 10 all backend components
      source: '@docs/architecture.md#6-constraints'
      impact: { all-engineers: Non-negotiable }
