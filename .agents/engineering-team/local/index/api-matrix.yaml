# class: api-matrix
# source: docs/architecture.md §7 API Contract (+ CR-0003 topology + CR-0008 validation/OpenAPI)
# recipe: builtin:architecture

endpoints:
  - method: POST
    path: /api/deployments
    surface: Write
    auth: X-Api-Key (required)
    success: 201 Created
    errors: [401 missing/invalid key, 422 invalid payload]
    request-shape-ref: '@docs/architecture.md#api-contract (POST body table)'
    notes: |
      Required fields: service, environment, version, status (in-progress|success|failure),
      run_url, run_number, actor. Optional (CR-0004): ref, sha. CR-0003 adds deployment_id (required) +
      parent_deployments (optional). CR-0008 standardised length-only validation + RFC-7807 errors.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments
    surface: Read
    auth: none
    success: 200 OK
    response-shape-ref: '@docs/architecture.md#api-contract (Matrix response shape — per service)'
    query-params:
      - correlationAttribute (CR-0003) — per-request override of topology correlation attribute
    notes: Matrix = latest entry per (service,environment). Includes topology.edges per service (CR-0003).
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments/{service}/{environment}
    surface: Read
    auth: none
    success: 200
    errors: [404 no history]
    notes: Current state for one slot
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/deployments/{service}/{environment}/history
    surface: Read
    auth: none
    success: 200
    errors: [404 no history]
    query-params: ["limit (default 50)"]
    notes: Last N events for a slot
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/environments
    surface: Read
    auth: none
    success: 200
    notes: Distinct environments derived from stored data (FR-09)
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/services
    surface: Read
    auth: none
    success: 200
    notes: Distinct services derived from stored data (FR-09)
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /api/stream
    surface: Read
    auth: none
    success: 200 text/event-stream
    notes: |
      SSE; supports Last-Event-ID for reconnection (NFR-05). Emits slot-update events with full per-slot
      state object identical to GET /api/deployments shape. CR-0003: SSE carries slot updates only; topology
      refreshes via a separate GET. Gateway tuning: proxy_buffering off, proxy_read_timeout 1h.
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /health
    surface: Read
    auth: none
    success: 200
    response: '{"status":"ok"}'
    source: '@docs/architecture.md#api-contract'

  - method: GET
    path: /
    surface: SPA (via gateway → dashboard:80)
    auth: none
    success: 200
    notes: Serves SPA shell + Angular bundle with HTML5 history fallback to index.html
    source: '@docs/architecture.md#api-contract'

cross-cutting:
  rest-constraints:
    - Stateless — no sessions, no cookies
    - Uniform interface — POST=create, GET=read
    - Resource-oriented URIs
    - Meaningful status codes (201/401/404/422)
  validation:
    standard: length-only (CR-0008)
    errors: RFC-7807 ProblemDetails
    spec: OpenAPI 3.x + Scalar UI
    source: '@docs/cr/CR-0008-api-validation-and-openapi-scalar.md'
  topology-payload:
    shape: '{ edges: [ { from, to, source: explicit|correlated } ] } per service'
    source: '@docs/adr/ADR-0001-topology-derivation-five-pass.md'
  sse-event-shape: '@docs/architecture.md#api-contract (SSE slot-update data payload)'
