# class: ui-states
# source: docs/architecture.md §7 Dashboard Frontend (6 box states) + docs/ui/deployment-dashboard.html (mockup state ids)
# recipe: builtin:architecture

box-states:
  - name: Success
    state-id: success                      # mockup state id in dashboard()/SERVICES
    condition: Last deployment succeeded
    visual: Full green box — version + actor + time
    fixture-ref: '@docs/ui/deployment-dashboard.html:2453'   # statusByState map
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 1

  - name: Running + Last Successful
    state-id: running-with-last
    condition: Deploying now; previous terminal was success
    visual: Top — orange spinner + version; Bottom — last successful version
    fixture-ref: '@docs/ui/deployment-dashboard.html:2509'
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 2

  - name: Running + Failed + Last Successful
    state-id: running-failed-with-last
    condition: Deploying now; previous terminal was failure; older success exists
    visual: Top — orange spinner + warn-prev-failed badge; Bottom — last successful version
    fixture-ref: '@docs/ui/deployment-dashboard.html:2534'
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 3

  - name: Failed + Last Successful
    state-id: failed-with-last
    condition: Last deployment failed; older success exists
    visual: Top — red failed + version; Bottom — last successful version
    fixture-ref: '@docs/ui/deployment-dashboard.html:2513'
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 4

  - name: Running
    state-id: running
    condition: Deploying now; no prior successful deployment
    visual: Full orange spinning box — version only
    fixture-ref: '@docs/ui/deployment-dashboard.html:2456'
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 5

  - name: Running + Failed
    state-id: running-failed
    condition: Deploying now; previous terminal was failure; no successful history
    visual: Top — orange spinner + warn-prev-failed badge; no bottom section
    fixture-ref: '@docs/ui/deployment-dashboard.html:2544'
    source-doc: '@docs/architecture.md#dashboard-frontend-mvp'
    sad-row: 6

cross-cutting:
  split-section-rule: Box split by dashed divider when a last-successful state differs from current.
  version-highlight: Hovering a version amber-highlights all boxes across envs with the same version.
  per-slot-wire-shape: '@docs/architecture.md#api-contract (Matrix response shape — per service)'
  state-axis-doc: '@docs/architecture.md#dashboard-frontend-mvp (6 box states table)'
  mockup-statusByState-map: '@docs/ui/deployment-dashboard.html:2452-2460'
