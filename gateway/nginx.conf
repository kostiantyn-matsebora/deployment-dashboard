# App Gateway nginx config — the only public surface (SAD §7).
#
# Routing matrix:
#   POST /api/deployments    → write-api:8080/api/deployments
#   GET  /api/stream         → read-api:8080/api/stream  (SSE pass-through)
#   GET  /api/*              → read-api:8080$request_uri
#   GET  /health             → read-api:8080/health
#   GET  / + everything else → dashboard:80$request_uri  (SPA shell;
#                              the dashboard nginx handles HTML5 fallback
#                              to index.html for unknown SPA routes.)
#
# Statelessness: pure proxy, no per-request state. No sticky sessions
# (NFR-05); SSE clients reconnect via Last-Event-ID, which is forwarded
# below verbatim.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # ----- Logging --------------------------------------------------------
    # Default combined log + a $request_method column so we can see at a
    # glance which backend a request went to.
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;

    # ----- Gzip — JSON + HTML only, NEVER text/event-stream --------------
    # Gzip on SSE would buffer the stream and break the 5-second NFR-03
    # delivery guarantee. text/event-stream is intentionally omitted.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    5;
    # text/html is gzipped by default — listing it here triggers a duplicate
    # MIME type warning at boot. Only declare the extra types we want.
    gzip_types         application/json;
    gzip_disable       "msie6";

    # ----- Upstreams ------------------------------------------------------
    # One per backend. Docker DNS resolves these to the container IP; under
    # the scaled compose `read-api`/`write-api` resolve to multiple IPs and
    # nginx round-robins across them.
    upstream write_api {
        server write-api:8080;
        keepalive 16;
    }
    upstream read_api {
        server read-api:8080;
        keepalive 32;
    }
    upstream dashboard_static {
        server dashboard:80;
        keepalive 16;
    }

    # ----- Method-split map for /api/deployments -------------------------
    # POST → write_api; everything else (GET, HEAD) → read_api. The map is
    # evaluated once per request and used as $deployments_upstream below.
    map $request_method $deployments_upstream {
        POST    write_api;
        default read_api;
    }

    # ----- Custom error pages --------------------------------------------
    # Small inline HTML instead of nginx's default page. Served when an
    # upstream is unreachable (502) or times out (504). Keeps the public
    # surface free of nginx version strings and similar leakage.

    server {
        listen 80 default_server;
        server_name _;

        # Health surface used by Docker HEALTHCHECK in the gateway image
        # itself. Does not proxy upstream — pure local liveness.
        location = /__gateway_health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "gateway-ok\n";
        }

        # Custom 502 / 504 pages (NOT nginx defaults).
        error_page 502 = @gateway_502;
        error_page 504 = @gateway_504;
        location @gateway_502 {
            internal;
            add_header Content-Type text/html always;
            return 502 '<!doctype html><html><head><title>502 — Upstream Unavailable</title></head><body style="font-family:system-ui,sans-serif;padding:2rem"><h1>502 — Upstream Unavailable</h1><p>The Deployment Dashboard gateway could not reach an upstream service. Check <code>docker compose ps</code>.</p></body></html>';
        }
        location @gateway_504 {
            internal;
            add_header Content-Type text/html always;
            return 504 '<!doctype html><html><head><title>504 — Upstream Timeout</title></head><body style="font-family:system-ui,sans-serif;padding:2rem"><h1>504 — Upstream Timeout</h1><p>An upstream service took too long to respond.</p></body></html>';
        }

        # -----------------------------------------------------------------
        # POST /api/deployments → write-api  (everything else → read-api)
        # -----------------------------------------------------------------
        # The `map` above selects $deployments_upstream by HTTP method,
        # so this single location handles both GET (read) and POST (write).
        location = /api/deployments {
            proxy_pass         http://$deployments_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
            # Preserve API key + content-type on POSTs without copying them
            # explicitly — proxy_pass forwards request headers by default.
        }

        # -----------------------------------------------------------------
        # GET /api/stream → read-api  (SSE pass-through)
        # -----------------------------------------------------------------
        # SSE requirements (SAD §7 "App Gateway"):
        #   - proxy_buffering off          — flush events as soon as written
        #   - proxy_cache off              — never cache the stream
        #   - proxy_read_timeout 1h        — keep idle connections alive
        #   - chunked_transfer_encoding on — Transfer-Encoding: chunked
        #   - X-Accel-Buffering: no        — disable any downstream buffer
        #   - Last-Event-ID forwarded      — browser reconnect resumes
        location = /api/stream {
            proxy_pass         http://read_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
            # SSE reconnect handshake — must survive the proxy hop.
            proxy_set_header   Last-Event-ID     $http_last_event_id;
            proxy_set_header   X-Accel-Buffering "no";

            proxy_buffering           off;
            proxy_cache               off;
            proxy_read_timeout        1h;
            proxy_send_timeout        1h;
            chunked_transfer_encoding on;

            # Don't gzip the stream — overrides the http-level gzip on.
            gzip off;
        }

        # -----------------------------------------------------------------
        # GET /health → read-api/health
        # -----------------------------------------------------------------
        location = /health {
            proxy_pass         http://read_api/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # GET /api/* (anything else under /api/) → read-api
        # -----------------------------------------------------------------
        # Matrix, history, discovery endpoints. The two more-specific
        # `location =` blocks above (deployments, stream) win over this one.
        location /api/ {
            proxy_pass         http://read_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # Everything else → dashboard:80  (SPA shell, with HTML5 fallback
        # handled inside the dashboard container's own nginx config).
        # -----------------------------------------------------------------
        location / {
            proxy_pass         http://dashboard_static$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }
    }
}
