# App Gateway nginx config — the only public surface (SAD §7).
#
# Routing matrix (per SAD §7 "Routing matrix" + §10 Decision 11; OpenAPI
# and Scalar rows per CR-0008):
#   POST /api/deployments    → api:8080/api/deployments
#   GET  /api/stream         → api:8080/api/stream  (SSE pass-through)
#   GET  /api/*              → api:8080$request_uri
#   GET  /health             → api:8080/health
#   GET  /openapi/*          → api:8080$request_uri  (OpenAPI JSON; unauth)
#   GET  /scalar(/*)         → api:8080$request_uri  (Scalar UI; unauth)
#   GET  / + everything else → dashboard:80$request_uri  (SPA shell;
#                              the dashboard nginx handles HTML5 fallback
#                              to index.html for unknown SPA routes.)
#
# Today both API surfaces resolve to a single `api` upstream (one
# container, both surfaces). The location blocks are intentionally kept
# keyed by path + method so a future re-split into separate `write-api`
# and `read-api` upstreams (per SAD §"Backend module architecture" →
# "Future split") is a config-only change: change `proxy_pass` on the
# `POST /api/deployments` block to point at the new write upstream and
# leave every other block untouched.
#
# Statelessness: pure proxy, no per-request state. No sticky sessions
# (NFR-05); SSE clients reconnect via Last-Event-ID, which is forwarded
# below verbatim.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # ----- Logging --------------------------------------------------------
    # Default combined log + a $request_method column so we can see at a
    # glance which backend a request went to.
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;

    # ----- Gzip — JSON + HTML only, NEVER text/event-stream --------------
    # Gzip on SSE would buffer the stream and break the 5-second NFR-03
    # delivery guarantee. text/event-stream is intentionally omitted.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    5;
    # text/html is gzipped by default — listing it here triggers a duplicate
    # MIME type warning at boot. Only declare the extra types we want.
    gzip_types         application/json;
    gzip_disable       "msie6";

    # ----- Upstreams ------------------------------------------------------
    # Per SAD §10 Decision 11, the Write and Read surfaces are composed
    # into a single `api` host container — one upstream covers both. Docker
    # DNS resolves `api` to one container under the local compose, or to N
    # replica IPs under the scaled compose (round-robin handled by nginx).
    #
    # The location blocks below remain split by path + method so a future
    # re-split into two upstreams is a config-only change.
    upstream api {
        server api:8080;
        keepalive 32;
    }
    upstream dashboard_static {
        server dashboard:80;
        keepalive 16;
    }

    # ----- Custom error pages --------------------------------------------
    # Small inline HTML instead of nginx's default page. Served when an
    # upstream is unreachable (502) or times out (504). Keeps the public
    # surface free of nginx version strings and similar leakage.

    server {
        listen 80 default_server;
        server_name _;

        # Health surface used by Docker HEALTHCHECK in the gateway image
        # itself. Does not proxy upstream — pure local liveness.
        location = /__gateway_health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "gateway-ok\n";
        }

        # Custom 502 / 504 pages (NOT nginx defaults).
        error_page 502 = @gateway_502;
        error_page 504 = @gateway_504;
        location @gateway_502 {
            internal;
            add_header Content-Type text/html always;
            return 502 '<!doctype html><html><head><title>502 — Upstream Unavailable</title></head><body style="font-family:system-ui,sans-serif;padding:2rem"><h1>502 — Upstream Unavailable</h1><p>The Deployment Dashboard gateway could not reach an upstream service. Check <code>docker compose ps</code>.</p></body></html>';
        }
        location @gateway_504 {
            internal;
            add_header Content-Type text/html always;
            return 504 '<!doctype html><html><head><title>504 — Upstream Timeout</title></head><body style="font-family:system-ui,sans-serif;padding:2rem"><h1>504 — Upstream Timeout</h1><p>An upstream service took too long to respond.</p></body></html>';
        }

        # -----------------------------------------------------------------
        # POST /api/deployments → api  (write surface inside the host)
        # -----------------------------------------------------------------
        # Today both GET and POST resolve to the same `api` upstream. The
        # block is kept dedicated so a future re-split (per SAD §"Backend
        # module architecture" → "Future split") changes one `proxy_pass`
        # to point at a new write upstream and nothing else.
        location = /api/deployments {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
            # Preserve API key + content-type on POSTs without copying them
            # explicitly — proxy_pass forwards request headers by default.
        }

        # -----------------------------------------------------------------
        # GET /api/stream → api  (SSE pass-through — read surface)
        # -----------------------------------------------------------------
        # SSE requirements (SAD §7 "App Gateway"):
        #   - proxy_buffering off          — flush events as soon as written
        #   - proxy_cache off              — never cache the stream
        #   - proxy_read_timeout 1h        — keep idle connections alive
        #   - chunked_transfer_encoding on — Transfer-Encoding: chunked
        #   - X-Accel-Buffering: no        — disable any downstream buffer
        #   - Last-Event-ID forwarded      — browser reconnect resumes
        location = /api/stream {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
            # SSE reconnect handshake — must survive the proxy hop.
            proxy_set_header   Last-Event-ID     $http_last_event_id;
            proxy_set_header   X-Accel-Buffering "no";

            proxy_buffering           off;
            proxy_cache               off;
            proxy_read_timeout        1h;
            proxy_send_timeout        1h;
            chunked_transfer_encoding on;

            # Don't gzip the stream — overrides the http-level gzip on.
            gzip off;
        }

        # -----------------------------------------------------------------
        # GET /health → api/health
        # -----------------------------------------------------------------
        location = /health {
            proxy_pass         http://api/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # GET /api/* (anything else under /api/) → api  (read surface)
        # -----------------------------------------------------------------
        # Matrix, history, discovery, topology-config endpoints. The two
        # more-specific `location =` blocks above (deployments, stream)
        # win over this one.
        location /api/ {
            proxy_pass         http://api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # GET /openapi/* → api  (OpenAPI document, per CR-0008)
        # -----------------------------------------------------------------
        # ASP.NET Core's Microsoft.AspNetCore.OpenApi serves the document at
        # /openapi/v1.json (and sibling versioned docs). Unauthenticated by
        # design — NFR-04 restricts the whole gateway to the internal
        # network, and the Read surface is unauthenticated per SAD §8.
        # Simple JSON; no SSE tuning, no buffering tweaks.
        location /openapi/ {
            proxy_pass         http://api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # GET /scalar, GET /scalar/* → api  (Scalar UI, per CR-0008)
        # -----------------------------------------------------------------
        # Scalar.AspNetCore mounts an interactive API reference at /scalar
        # plus any static assets it needs under /scalar/*. Unauthenticated
        # for the same NFR-04 reason as the OpenAPI document. HTML +
        # static JS/CSS; no SSE tuning required.
        location /scalar {
            proxy_pass         http://api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }

        # -----------------------------------------------------------------
        # Everything else → dashboard:80  (SPA shell, with HTML5 fallback
        # handled inside the dashboard container's own nginx config).
        # -----------------------------------------------------------------
        location / {
            proxy_pass         http://dashboard_static$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   User-Agent        $http_user_agent;
        }
    }
}
