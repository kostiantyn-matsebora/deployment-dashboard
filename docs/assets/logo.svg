<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deployment Dashboard">
  <!-- Slate card -->
  <rect width="64" height="64" rx="14" fill="#1e293b"/>

  <!-- 3×3 CELLS (slot containers — services × environments) -->
  <g fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.6">
    <rect x="8"  y="8"  width="16" height="16" rx="1.5"/>
    <rect x="24" y="8"  width="16" height="16" rx="1.5"/>
    <rect x="40" y="8"  width="16" height="16" rx="1.5"/>
    <rect x="8"  y="24" width="16" height="16" rx="1.5"/>
    <rect x="24" y="24" width="16" height="16" rx="1.5"/>
    <rect x="40" y="24" width="16" height="16" rx="1.5"/>
    <rect x="8"  y="40" width="16" height="16" rx="1.5"/>
    <rect x="24" y="40" width="16" height="16" rx="1.5"/>
    <rect x="40" y="40" width="16" height="16" rx="1.5"/>
  </g>

  <!-- ANIMATED pulse halo around the in-progress deployment (inside its cell).
       Opacity + stroke-width both pulse over 1.8s, matching the dashboard mockup's
       CSS pulse duration. Static fallback when animation is disabled (PNG renders,
       low-power mode): the halo stays visible at mid-opacity. -->
  <rect x="41.5" y="9.5" width="13" height="13" rx="1.2" fill="none" stroke="#fb923c" stroke-width="0.5">
    <animate attributeName="opacity"      values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="0.5;1.2;0.5" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- DEPLOYMENTS inside the cells, each with a version label -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="5" font-weight="700" text-anchor="middle">

    <!-- Row 1 — service A: prod deploy 1.2 → 1.3 in progress -->
    <rect x="10.5" y="10.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="16" y="17.7" fill="#1e293b">1.2</text>

    <rect x="26.5" y="10.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="32" y="17.7" fill="#1e293b">1.2</text>

    <rect x="42.5" y="10.5" width="11" height="11" rx="1" fill="#fb923c"/>
    <text x="48" y="17.7" fill="#ffffff">1.3</text>

    <!-- Row 2 — service B: 2.1 failed in qa -->
    <rect x="10.5" y="26.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="16" y="33.7" fill="#1e293b">2.0</text>

    <rect x="26.5" y="26.5" width="11" height="11" rx="1" fill="#ef4444"/>
    <text x="32" y="33.7" fill="#ffffff">2.1</text>

    <rect x="42.5" y="26.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="48" y="33.7" fill="#1e293b">2.0</text>

    <!-- Row 3 — service C: all healthy on 3.4 -->
    <rect x="10.5" y="42.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="16" y="49.7" fill="#1e293b">3.4</text>

    <rect x="26.5" y="42.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="32" y="49.7" fill="#1e293b">3.4</text>

    <rect x="42.5" y="42.5" width="11" height="11" rx="1" fill="#ffffff" opacity="0.92"/>
    <text x="48" y="49.7" fill="#1e293b">3.4</text>
  </g>
</svg>
