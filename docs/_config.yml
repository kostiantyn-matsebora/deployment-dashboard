title: Deployment Dashboard
description: Real-time services x environments deployment matrix sourced from any CI/CD tool.
url: https://kostiantyn-matsebora.github.io
baseurl: /deployment-dashboard
repository: kostiantyn-matsebora/deployment-dashboard

remote_theme: just-the-docs/just-the-docs

search_enabled: true
color_scheme: light

aux_links:
  "Get Started":
    - /deployment-dashboard/getting-started
  "GitHub Repo":
    - https://github.com/kostiantyn-matsebora/deployment-dashboard
aux_links_new_tab: true

nav_external_links:
  - title: Built with ginee
    url: https://github.com/kostiantyn-matsebora/ginee
    hide_icon: false

footer_content: 'Deployment Dashboard - built end-to-end by AI via <a href="https://github.com/kostiantyn-matsebora/ginee">ginee</a>. Pre-1.0 - APIs may change.'

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - ui/deployment-dashboard.html

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-default-layout

markdown: kramdown
kramdown:
  input: GFM

# Just the Docs native mermaid support — enables rendering of
# ```mermaid``` code fences in docs/index.md and elsewhere.
mermaid:
  version: "10.9.1"
