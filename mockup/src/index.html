<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deployment Dashboard — Mockup</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- FOIT-safe theme bootstrap: reads mockup.theme from localStorage before
       Angular hydrates, sets [data-theme] on <html> so the first paint is
       already in the correct palette. Mirrors the SPA's inline bootstrap. -->
  <script>
    (function() {
      var stored = null;
      try { stored = localStorage.getItem('mockup.theme'); } catch(e) {}
      if (stored !== 'light' && stored !== 'dark' && stored !== 'auto') stored = 'auto';
      var osDark = false;
      try { osDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) {}
      var effective = stored === 'auto' ? (osDark ? 'dark' : 'light') : stored;
      document.documentElement.setAttribute('data-theme', effective);
      document.documentElement.setAttribute('data-theme-pref', stored);
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-[#0d1117]">
  <dd-mockup-root></dd-mockup-root>
</body>
</html>
