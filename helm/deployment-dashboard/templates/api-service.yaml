apiVersion: v1
kind: Service
metadata:
  name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "deployment-dashboard.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "deployment-dashboard.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
