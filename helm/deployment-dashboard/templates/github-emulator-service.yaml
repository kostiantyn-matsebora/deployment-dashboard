{{- if .Values.demo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "github-emulator") }}
  labels:
    {{- include "deployment-dashboard.componentLabels" (dict "root" . "component" "github-emulator") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "deployment-dashboard.componentSelectorLabels" (dict "root" . "component" "github-emulator") | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
{{- end }}
