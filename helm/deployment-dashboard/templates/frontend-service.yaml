apiVersion: v1
kind: Service
metadata:
  name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "deployment-dashboard.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "deployment-dashboard.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
