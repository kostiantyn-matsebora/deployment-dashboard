{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $password := .Values.postgresql.auth.password }}
{{- /* Zero-config demo (mirrors docker-compose.demo.yaml postgres/dashboard/changeme). */}}
{{- if and .Values.demo.enabled (not $password) }}
{{- $password = "changeme" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deployment-dashboard.postgresSecretName" . }}
  labels:
    {{- include "deployment-dashboard.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresql.auth.password is required when postgresql.enabled and no existingSecret is set (or set demo.enabled)" $password | quote }}
{{- end }}
