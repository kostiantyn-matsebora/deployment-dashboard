{{- if not .Values.existingSecret }}
{{- $apiKey := .Values.apiKey }}
{{- $controlKey := .Values.controlApiKey }}
{{- /* Zero-config demo (mirrors docker-compose.demo.yaml): insecure defaults
       apply ONLY when demo.enabled and the adopter has not overridden them. */}}
{{- if and .Values.demo.enabled (not $apiKey) }}
{{- $apiKey = "demo-api-key" }}
{{- end }}
{{- if and .Values.demo.enabled (not $controlKey) }}
{{- $controlKey = "demo-control-key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deployment-dashboard.apiSecretName" . }}
  labels:
    {{- include "deployment-dashboard.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "apiKey is required unless existingSecret or demo.enabled is set" $apiKey | quote }}
  control-api-key: {{ $controlKey | quote }}
{{- end }}
