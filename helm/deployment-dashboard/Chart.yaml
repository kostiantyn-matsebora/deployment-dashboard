apiVersion: v2
name: deployment-dashboard
description: A self-hosted deployment/version dashboard — ingests deployment events (push or pull) and shows current + historical service versions per environment.
type: application
# Committed baseline. The release workflow (.github/workflows/release.yml,
# job `helm-chart`) overrides BOTH version and appVersion to the release SemVer
# at `helm package` time — never hand-edit these per release.
version: 0.1.0
appVersion: "latest"
icon: https://raw.githubusercontent.com/kostiantyn-matsebora/deployment-dashboard/main/docs/design/logo/logo-512.png
home: https://kostiantyn-matsebora.github.io/deployment-dashboard/
sources:
  - https://github.com/kostiantyn-matsebora/deployment-dashboard
keywords:
  - deployment
  - dashboard
  - devops
  - ci-cd
  - version-tracking
  - observability
maintainers:
  - name: Kostiantyn Matsebora
    email: komkom@duck.com
    url: https://github.com/kostiantyn-matsebora
annotations:
