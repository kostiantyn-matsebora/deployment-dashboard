  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Homepage
      url: https://kostiantyn-matsebora.github.io/deployment-dashboard/
    - name: Source
      url: https://github.com/kostiantyn-matsebora/deployment-dashboard
    - name: Documentation
      url: https://kostiantyn-matsebora.github.io/deployment-dashboard/
