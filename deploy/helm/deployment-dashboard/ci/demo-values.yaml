# helm install-test overlay: demo on (Demo Driver + GitHub Emulator + Fetcher).
# apiKey / controlApiKey / postgresql.auth.password are intentionally UNSET —
# demo.enabled triggers the chart's zero-config insecure defaults (mirrors
# docker-compose.demo.yaml), so no secret needs to be supplied for evaluation.

gateway:
  enabled: true
  # TEMPORARY image-skew shim — the install-test runs published `latest` images; the
  # pre-auto-detect demo-gateway bakes ENV DNS_RESOLVER=127.0.0.11 which wins when the
  # chart renders no env. 10.96.0.10 = kind's cluster-DNS ClusterIP. Remove once a
  # demo-gateway image containing 15-detect-dns-resolver.envsh is published (then the
  # overlay exercises auto-detect by omission).
  dnsResolver: "10.96.0.10"

ingress:
  enabled: true
  className: nginx

postgresql:
  enabled: true
  persistence:
    enabled: false   # kind has no default StorageClass by default; emptyDir keeps the install-test fast & disposable

demo:
  enabled: true
  emitIntervalMs: 1000   # fast cadence so install-test assertions don't wait 8s/tick
