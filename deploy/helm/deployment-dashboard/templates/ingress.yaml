{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "deployment-dashboard.fullname" . }}
  labels:
    {{- include "deployment-dashboard.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.gateway.enabled }}
    # SSE note (docs/GATEWAY_SPECIFICATION.md §5): ingress-nginx passes SSE
    # through by default. This annotation is added on the api path for safety
    # so /api/events/stream is never buffered by the ingress controller.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- if .Values.gateway.enabled }}
          # ── Option A: gateway Pod is the single public surface ──────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "gateway") }}
                port:
                  number: 8080
          {{- else }}
          # ── Option B: native Ingress path routing (longest-prefix first, "/" last) ──
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 8080
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 8080
          - path: /scalar
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 8080
          - path: /openapi
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 8080
          {{- if .Values.demo.enabled }}
          - path: /demo
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "demo-driver") }}
                port:
                  number: 3001
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deployment-dashboard.componentName" (dict "root" . "component" "frontend") }}
                port:
                  number: 80
          {{- end }}
{{- end }}
