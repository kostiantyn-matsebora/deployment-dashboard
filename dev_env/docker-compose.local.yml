# Deployment Dashboard - local-dev compose OVERRIDE (issue #21).
#
# Layered onto `install/docker-compose.release.yml` via Compose's native
# `-f` chaining. The release file is the canonical service inventory
# (services / profiles / env-var contract / volumes); this file ONLY
# carries the contributor-flow deltas:
#   - `build:` blocks instead of GHCR-pinned image refs for core services
#     (api, dashboard, gateway, fetcher).
#   - `pull_policy: never` so `docker compose pull` cannot try to fetch
#     the locally-built `:dev` tags from any registry.
#   - Dev-literal substitutions for secrets (POSTGRES_PASSWORD / API_TOKEN /
#     ConnectionStrings__DefaultConnection).
#   - `pgadmin` convenience service (release stack drops it per issue #7).
#
# Demo services (demo-gha / demo-driver) local build overrides are in
# `dev_env/docker-compose.demo-local.yml` -- NOT here. That overlay is
# only added to the compose chain for demo mode (start.ps1 -Demo / default)
# to avoid polluting the integration and other non-demo chains. (issue #72)
#
# Integration test substrate (mock-gha service) is in
# `dev_env/docker-compose.integration.yml`. (issue #72 ASR-B)
#
# Run with: pwsh -NoProfile -File dev_env/start.ps1
#   Default (demo mode):
#      docker compose -f install/docker-compose.release.yml \
#                     -f install/docker-compose.demo.yml \
#                     -f dev_env/docker-compose.local.yml \
#                     -f dev_env/docker-compose.demo-local.yml \
#                     --profile db --profile fetcher up -d --build
#   Integration mode (-Integration):
#      docker compose -f install/docker-compose.release.yml \
#                     -f dev_env/docker-compose.local.yml \
#                     -f dev_env/docker-compose.integration.yml \
#                     --profile db --profile fetcher up -d --build
#
# Migrations: the API container self-applies pending EF migrations on
# startup (ADR-0009). Same path as the release stack -- no separate
# runner service in either file.
#
# Zero-setup invariant: every dev value below is inline; no .env /
# .env.local files. Compose may emit "variable POSTGRES_PASSWORD not set"
# warnings for the three release-file substitutions noted above -- they
# are cosmetic; this override re-sets the same keys via service-level
# `environment:` merge so the resolved value is the dev literal.

name: deployment-dashboard

services:
  db:
    environment:
      POSTGRES_PASSWORD: "local-dev-password"

  # Co-located Write + Read API host (SAD §7, §10 Decision 11, ADR-0006).
  # API-key middleware is applied by the host to the write endpoint
  # group only; the read endpoints stay unauthenticated.
  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    image: deployment-dashboard/api:dev
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Database=dashboard;Username=dashboard;Password=local-dev-password"
      API_TOKEN: "demo-api-token"

  dashboard:
    build:
      context: ../frontend
      dockerfile: dashboard/Dockerfile
    image: deployment-dashboard/dashboard:dev
    pull_policy: never

  gateway:
    build:
      context: ../gateway
    image: deployment-dashboard/gateway:dev
    pull_policy: never

  # Pull-mode fetcher (CR-0009 / CR-0011) -- profile-gated by release;
  # opt-in via `start.ps1 -Fetcher`. The override only swaps the image
  # and the write-API key for the dev literal; every other env var
  # (FETCHER_POLL_INTERVAL_SECONDS, GHA_TOKEN, GHA_REPOSITORIES, ...)
  # is inherited from the release file with its existing `${VAR:-default}`
  # substitutions, so `start.ps1 -Demo` keeps working without re-stating
  # the values here.
  fetcher:
    build:
      context: ../backend
      dockerfile: fetcher-host/Dockerfile
    image: deployment-dashboard/fetcher:dev
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      DASHBOARD_WRITE_API_KEY: "demo-api-token"

  # Dev-only convenience -- not present in the release stack.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dashboard-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
