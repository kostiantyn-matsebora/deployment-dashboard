# Deployment Dashboard - local-dev compose OVERRIDE (issue #21).
#
# Layered onto `install/docker-compose.release.yml` via Compose's native
# `-f` chaining. The release file is the canonical service inventory
# (services / profiles / env-var contract / volumes); this file ONLY
# carries the contributor-flow deltas:
#   - `build:` blocks instead of GHCR-pinned image refs.
#   - `pull_policy: never` so `docker compose pull` cannot try to fetch
#     the locally-built `:dev` tags from any registry.
#   - Dev-literal substitutions for the three secrets the release file
#     reads from `dashboard.env` (POSTGRES_PASSWORD / API_TOKEN /
#     ConnectionStrings__DefaultConnection).
#   - `pgadmin` convenience service (release stack drops it per issue #7).
#
# Run with: pwsh -NoProfile -File dev_env/start.ps1
#   (the start.ps1 wrapper expands to:
#      docker compose -f install/docker-compose.release.yml \
#                     -f dev_env/docker-compose.local.yml up -d --build)
#
# Migrations: the API container self-applies pending EF migrations on
# startup (ADR-0009). Same path as the release stack -- no separate
# runner service in either file.
#
# Zero-setup invariant: every dev value below is inline; no .env /
# .env.local files. Compose may emit "variable POSTGRES_PASSWORD not set"
# warnings for the three release-file substitutions noted above -- they
# are cosmetic; this override re-sets the same keys via service-level
# `environment:` merge so the resolved value is the dev literal.

name: deployment-dashboard

services:
  db:
    environment:
      POSTGRES_PASSWORD: "local-dev-password"

  # Co-located Write + Read API host (SAD §7, §10 Decision 11, ADR-0006).
  # API-key middleware is applied by the host to the write endpoint
  # group only; the read endpoints stay unauthenticated.
  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    image: deployment-dashboard/api:dev
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Database=dashboard;Username=dashboard;Password=local-dev-password"
      API_TOKEN: "local-dev-token-not-for-production"

  dashboard:
    build:
      context: ../frontend
      dockerfile: dashboard/Dockerfile
    image: deployment-dashboard/dashboard:dev
    pull_policy: never

  gateway:
    build:
      context: ../gateway
    image: deployment-dashboard/gateway:dev
    pull_policy: never

  # Pull-mode fetcher (CR-0009 / CR-0011) -- profile-gated by release;
  # opt-in via `start.ps1 -Fetcher`. The override only swaps the image
  # and the write-API key for the dev literal; every other env var
  # (FETCHER_POLL_INTERVAL_SECONDS, GHA_TOKEN, GHA_REPOSITORIES, ...)
  # is inherited from the release file with its existing `${VAR:-default}`
  # substitutions, so `start.ps1 -Demo` keeps working without re-stating
  # the values here.
  fetcher:
    build:
      context: ../backend
      dockerfile: fetcher-host/Dockerfile
    image: deployment-dashboard/fetcher:dev
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      DASHBOARD_WRITE_API_KEY: "local-dev-token-not-for-production"
    # `depends_on: required: false` (docker compose >= 2.20) lets the
    # fetcher start whether or not `mock-gha` is active. Under the
    # `integration` compose profile `mock-gha` is up and we wait for its
    # `service_healthy` gate (CR-0012); for vanilla `dev_env/start.ps1`
    # bring-ups `mock-gha` is profile-gated out and this dependency is
    # silently skipped.
    depends_on:
      mock-gha:
        condition: service_healthy
        required: false

  # Mock GitHub API override (CR-0012).
  #
  # The release file (install/docker-compose.release.yml) carries the canonical
  # `mock-gha` service definition without any host-port publishing -- production
  # posture is NFR-04 strict (admin port never reachable from outside the Docker
  # network). This override layers ONE delta on top: publish the admin port to
  # host port 18080 so `dotnet test` running on the developer's host (or on the
  # GHA runner under `.github/workflows/integration.yml`) can POST scenario
  # bundles to <host>:18080/__admin/mappings/import. The mapping is gated to
  # the integration profile only -- a vanilla `docker compose up` (no
  # `--profile integration`) never starts mock-gha, so this ports stanza is
  # inert outside the integration flow.
  #
  # FETCHER_POLL_INTERVAL_SECONDS is NOT set here -- doing so would override
  # the release file's `${FETCHER_POLL_INTERVAL_SECONDS:-30}` substitution
  # unconditionally and break non-integration runs (a vanilla `start.ps1`
  # would suddenly poll once per second). Instead, `dev_env/start.ps1
  # -Integration` seeds `$env:FETCHER_POLL_INTERVAL_SECONDS = '1'` before
  # invoking docker compose, so the release file's substitution resolves to
  # `1` for integration runs and to `30` for everything else. Source of
  # truth: see start.ps1's -Integration canonicalisation block.
  mock-gha:
    ports:
      - "18080:80"
    # Bind-mount qa-engineer's base mappings into JVM WireMock's mappings
    # directory. JVM WireMock reads bootstrap mappings from
    # `/home/wiremock/mappings` at start-up; per-scenario overrides are
    # still loaded via the admin API at runtime (CR-0012 S 5), but the base
    # five-endpoint coverage matrix (CR-0009 S 3d / docs/integration-tests.md
    # S 6) is mounted once so a fresh `start.ps1 -Integration` boots with
    # the GHA contract surface already populated. `:ro` -- mappings are
    # source-of-truth in the repo; the container must not mutate them.
    # Mount lives in the override (not the release file) because the
    # release-install host has no source tree.
    # Issue #57: path changed from `/app/__admin/mappings` (WireMock.Net) to
    # `/home/wiremock/mappings` (JVM WireMock).
    volumes:
      - ../testing/fixtures/gha/mappings:/home/wiremock/mappings:ro

  # Demo-gha local build (demo profile). Build context MUST be the repo root
  # because the Dockerfile COPYs from testing/fixtures/gha/demo/ (outside
  # gateway/). Mirrors the CI workflow's `context-path: .` decision (CR-0013).
  demo-gha:
    build:
      context: ..
      dockerfile: gateway/demo-gha/Dockerfile
    image: deployment-dashboard/demo-gha:dev
    pull_policy: never

  # Demo-driver local build (demo profile). Also requires repo-root context:
  # its Dockerfile COPYs testing/fixtures/gha/demo/ + gateway/demo-driver/entrypoint.py.
  demo-driver:
    build:
      context: ..
      dockerfile: gateway/demo-driver/Dockerfile
    image: deployment-dashboard/demo-driver:dev
    pull_policy: never

  # Dev-only convenience -- not present in the release stack.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dashboard-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
