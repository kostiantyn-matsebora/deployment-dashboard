# Deployment Dashboard — horizontally-scaled compose for NFR-05 validation.
#
# NOT the default local-dev experience. Use this only to verify that the
# stack remains stateless when more than one API replica handles traffic —
# no sticky sessions, SSE fan-out via PostgreSQL LISTEN/NOTIFY.
#
# Mirrors SAD §7 "Horizontally scaled deployment" with the App Gateway
# topology and §10 Decision 11 (single backend host). The gateway IS the
# load-balancer (Docker DNS round-robins across the replica IPs of the
# single `api` service). There is no separate `lb` container — the
# gateway holds the only public port.
#
# Replicas:
#   - 3 × API        (Write + Read surfaces composed in one host; SSE
#                     fan-out via LISTEN/NOTIFY across all replicas)
#   - 1 × Dashboard  (static SPA — no need to scale)
#   - 1 × Gateway    (stateless proxy, no replication needed for the test)
#
# Run with: pwsh -NoProfile -File dev_env/start.ps1 -Scaled
#
# Zero-setup, no .env files: every value below is inline and obviously fake.
# Real production secrets live in Azure Key Vault and are wired in via
# Terraform + GitHub Actions Environments — never here.
#
# Host-published ports:
#   - 8080 → App Gateway  (dashboard URL — `http://localhost:8080/`)
#
# Migrations strategy: the API host applies pending EF Core migrations on
# start (between app.Build() and app.RunAsync()) -- see ADR-0009. All
# three replicas execute the same migration path; EF Core's idempotent
# migration contract makes concurrent re-apply a no-op. No separate
# runner service.

name: deployment-dashboard-scaled

services:
  db:
    image: postgres:16-alpine
    container_name: dashboard-db-scaled
    restart: unless-stopped
    environment:
      POSTGRES_DB: "dashboard"
      POSTGRES_USER: "dashboard"
      POSTGRES_PASSWORD: "local-dev-password"
    volumes:
      - pg-data-scaled:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Single backend container hosting both Write and Read surfaces
  # (SAD §7 "Backend module architecture", §10 Decision 11). Scaled to 3
  # replicas to validate NFR-05 statelessness: any replica accepts an
  # ingest POST and broadcasts via PG LISTEN/NOTIFY, every replica sees
  # the notification and fans out to its own SSE subscribers.
  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    image: deployment-dashboard/api:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Database=dashboard;Username=dashboard;Password=local-dev-password"
      API_TOKEN: "local-dev-token-not-for-production"
      HISTORY_RETENTION_DAYS: "365"
    deploy:
      replicas: 3
    expose:
      - "8080"                            # internal-only — gateway round-robins to replica IPs
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ../frontend
      dockerfile: dashboard/Dockerfile
    image: deployment-dashboard/dashboard:dev
    container_name: dashboard-frontend-scaled
    restart: unless-stopped
    expose:
      - "80"                              # internal-only — gateway routes / and SPA shell here

  gateway:
    build:
      context: ../gateway
    image: deployment-dashboard/gateway:dev
    container_name: dashboard-gateway-scaled
    restart: unless-stopped
    ports:
      - "8080:80"                         # ONLY host-published service
    depends_on:
      dashboard:
        condition: service_started
      api:
        condition: service_started

volumes:
  pg-data-scaled:
